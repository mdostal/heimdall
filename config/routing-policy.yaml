version: "1.0"
task_type_weights:
  planning:
    claude: 100
    gemini: 80
    codex: 60
    kimi: 40
    openrouter: 50
    grok: 50
  build:
    codex: 100
    claude: 80
    gemini: 60
    kimi: 40
    openrouter: 50
    grok: 50
  review:
    claude: 100
    codex: 80
    gemini: 60
    kimi: 40
    openrouter: 50
    grok: 50
headroom_floor: 1000
cost_preference: balanced
experiments:
  enabled: false
  arms:
    control:
      split: 1
# excluded_lanes (optional, heimdall#123): lane ids that must never be routed
# to. Applied to the candidate list before any strategy runs (priority,
# round-robin and scored alike), and it wins over a manual "enabled"
# override. A decision whose only healthy lane is excluded answers no route;
# it never falls back to the excluded lane. task_type_weights are keyed by
# provider family, so this is the only way to tell two lanes of the same
# provider apart. Withheld lanes are reported as `excluded_lanes` on the route
# response and recorded in the scored decision's rationale and ledger row
# (request_summary.constraints.excluded_lanes). Example:
#
# excluded_lanes:
#   - claude@mathew.dostal

# levels and work_classes (heimdall#142 slice 3): bind models and lanes to a
# level -- premium, standard or economy -- and say which levels each work
# class may run on. Applied to the candidate list before any strategy runs
# (priority, round-robin and scored alike), after excluded_lanes, and like
# excluded_lanes it wins over a manual "enabled" override.
#
# A lane's routed model (its HEIMDALL_LANE_<N>_MODEL, after any catalog
# substitution) gets its level from, most specific first:
#   1. the tier the lane declares on that model (HEIMDALL_LANE_<N>_MODELS
#      `model_id=premium`, or models[].tier in HEIMDALL_LANES_JSON);
#   2. levels.models below;
#   3. levels.lanes below (for a lane whose model field isn't a model id).
# A model nothing binds is "unbound" and is never treated as premium.
#
# Hard floor: build, review, release, code, and any class marked
# `code_work: true`, run on premium only. Configuring anything else for them
# is an invalid policy, and an invalid policy blocks routing (503). A class
# not listed here runs on premium only too: a lower level is opt-in, per
# class. When no lane at an allowed level is usable (unbound, toggled off,
# limit exhausted, or the lane is down) the verdict is `queue` with the
# earliest known `resets_at`, never a step down to a lower level.
#
# Off by default: with neither section present, routing behaves exactly as
# before slice 3. Turning it on is a deploy decision, because every lane whose
# HEIMDALL_LANE_<N>_MODEL isn't a model id bound below (e.g. a placeholder
# like "claude-sonnet" or "gpt-codex") becomes "unbound" and stops taking
# build/review work: bind those lanes under levels.lanes, or declare their
# models with tiers, before uncommenting. Example:
# levels:
#   models:
#     claude-fable-5-2: premium
#     claude-opus-5-5: premium
#     gpt-6-astra-high: premium
#     gemini-4-argon: premium
#     claude-sonnet-5-5: standard
#     claude-haiku-5-5: economy
#   lanes: {}
# work_classes:
#   build:
#     levels: [premium]
#   review:
#     levels: [premium]
#   release:
#     levels: [premium]
#   code:
#     levels: [premium]
#   planning:
#     levels: [premium]
#
# model_swap (heimdall#142 slice 4): with levels configured, a lane whose
# preferred model hits its own limit (or is turned off) routes the next model
# it declares in HEIMDALL_LANE_<N>_MODELS at the same level or higher, e.g.
# Fable -> Opus on one Claude subscription, and swaps back by itself once the
# limit resets or is cleared. Never below premium. On by default; to queue
# instead:
# model_swap:
#   enabled: false
#
# max_usage (heimdall#142 slice 5): the operator can turn on "max usage" for
# one account lane until an expiry (POST /lanes/:id/max-usage, MCP
# heimdall.lanes.maxUsage.set, or the dashboard). While on, that lane works
# through every premium model it serves, in its declared order, as each
# limit is reached (even with model_swap.enabled: false), and takes work
# ahead of other lanes; once it is exhausted, other lanes route as normal,
# then the verdict is queue. It never turns on paid credits or raises a
# spend cap. Needs levels. Defaults:
# max_usage:
#   max_hours: 168        # longest expiry the operator may set
#   prefer_account: true  # false = per-lane swap only, no preference
