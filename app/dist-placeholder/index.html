<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Heimdall</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel {
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
  }
  #status {
    color: #888;
    font-size: 0.85rem;
  }
  #spinner {
    width: 22px;
    height: 22px;
    margin: 0 auto 1rem;
    border: 2px solid rgba(128, 128, 128, 0.25);
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    #spinner { animation: none; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #err {
    display: none;
    color: #cf222e;
    font-size: 0.85rem;
    max-width: 320px;
  }
</style>
</head>
<body>
  <div class="panel">
    <div id="spinner"></div>
    <h1>Heimdall</h1>
    <div id="status">Starting the router service&hellip;</div>
    <div id="err"></div>
  </div>
</body>
</html>
