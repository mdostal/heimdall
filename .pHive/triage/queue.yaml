  - id: t-001
    state: closed
    kind: bug
    title: "main branch tip has an unreverted DELIBERATE_BREAK crash commit (6d00d71)"
    description: >
      origin/main's tip is commit 6d00d71 "DELIBERATE_BREAK: CD rollback test
      [PANT-24]" (2026-08-29, author "Mathew Dostal (hive)") — an
      unconditional `throw new Error(...)` inserted at the very top of
      src/main.ts, so any process that imports main.ts (the real service,
      the CLI, the desktop app) crashes immediately on load. The commit's own
      comment says "remove after scenario 2 capture" — it was meant to be
      temporary, reverted once its CD-rollback test scenario ran. Confirmed
      still live at the tip of origin/main as of 2026-09-06/07, 8 days later.
      No release tag was cut on top of it (git describe: v0.33.1-17-g6d00d71
      — 17 commits past the last tag, no new tag), and no open PR references
      PANT-24 or builds on top of it — no evidence the CD test is still
      in-progress. GitHub issue heimdall#86 (filed independently by a
      separate Claude Code session, same finding) already exists for this.
      Reproduction: `git show origin/main:src/main.ts | head -3` shows the
      throw; any `node --import tsx src/main.ts` run against that commit
      crashes instantly.
    reporter: mdostal (github issue #86, itself filed by a separate session)
    reported_at: "2026-09-07T01:08:51Z"
    priority: p0
    severity: critical
    linked_epic: null
    linked_story: null
    closed_reason: "fixed in PR #88 (revert commit a3fbb1b, merged 2400f6e); re-verified origin/main PASS via restored hive-verify.sh; heimdall#86 auto-closed"
    closed_at: "2026-09-07T01:26:52Z"
