    title: "MulticaControlAdapter's disable lever (max_concurrent_tasks: 0) rejected by real Multica API validation"
    description: >
      GitHub issue heimdall#83 (2026-08-27). Multica's real REST API rejects
      max_concurrent_tasks: 0 (min is 1, confirmed against Multica's own
      server source — concurrency is a throttle, not a switch, at any legal
      value, and the only true stop (ArchiveAgent) unconditionally cancels
      in-flight tasks). Per explicit operator direction in a prior session
      ("turn off the lever, don't fix it -- give back the status and we
      build the lever change on the pantheon"), this was already planned as
      a full Hive epic (hdl-multica-status-handoff) and substantively
      implemented: 3 stories committed on `feat/hdl-multica-status-handoff`
      (pushed to origin, not yet PR'd) — retires Heimdall's direct Multica
      actuation, exposes multica_agent_ids on GET /lanes, adds
      docs/decisions/DEC-hdl-multica-disable-contract.md. Local build+test
      green (701/701 at last check). Stalled because the repo's real merge
      gate (ssh dostal@100.75.161.82 /Users/dostal/hive-ci/verify-heimdall.sh
      <sha>) is missing from the build box entirely — only a week-old backup
