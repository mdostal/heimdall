  - id: t-003
    state: closed
    kind: bug
    title: "README's documented install path (curl install.sh) fails — pantheon-heimdall was never actually published to npm"
    description: >
      Found during the v0.36.0 release sweep. README.md's primary documented
      install command (`curl -fsSL https://mdostal.github.io/heimdall/
      install.sh | bash`) runs `scripts/install.sh`, which shells out to
      `npm install -g pantheon-heimdall`. Confirmed live: `npm view
      pantheon-heimdall version` returns a 404 — the package does not exist
      on the real npm registry. Despite CHANGELOG.md's v0.33.0 entry
      claiming "v0.33.0 went public as pantheon-heimdall on npm," it
      apparently never actually was (or was unpublished) — this predates
      this session's own work and wasn't introduced by it. `.pHive/
      project-profile.yaml`'s `ship_target.kind` is `github-release`, not
      `npm`, so this may be a case of docs/scripts written ahead of an npm
      publish that never happened, rather than a regression.
      Not fixed in this session — publishing a package to a public registry
      under the operator's account is a real, one-way action (npm's
      72-hour unpublish window aside) that shouldn't happen without
      explicit operator go-ahead.
    reporter: claude (v0.36.0 release sweep)
    reported_at: "2026-09-07T01:41:00Z"
    priority: p2
    severity: moderate
    linked_epic: null
    linked_story: null
    closed_reason: >
      Operator: "we can do the github release for now, we'll get the npm
      one as we go." Fixed scripts/install.sh to install straight from
      this repo's `main` branch via `npm install -g git+https://github.com/
      mdostal/heimdall.git#main` instead of the unpublished npm package
      name; added a `prepare: npm run build` script so npm builds `dist/`
      locally for a git-sourced install (verified end-to-end in a scratch
      clone — prepare fires, dist/ builds, `heimdall` bin runs correctly).
      docs/vision.md's "ships as a real npm package" claim corrected to be
      honest about current state. Re-publish gh-pages after merge so the
      live curl URL serves the fix. Revisit when npm publishing happens —
      switching INSTALL_SOURCE back is the only change needed.
    closed_at: "2026-09-07T02:35:00Z"
    state_history:
      - state: inbox
        at: "2026-09-07T01:41:00Z"
      - state: clarified
        at: "2026-09-07T02:30:00Z"
