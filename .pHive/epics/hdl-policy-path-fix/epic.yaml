description: >
  Found by actually installing and running the real desktop app end-to-end
  after the operator asked to keep it installed for real dogfooding (not
  found by the test suite, since no test exercised the packaged app's cwd).
  PolicyLoader.load()'s default path is `join(process.cwd(), "config",
  "routing-policy.yaml")` -- correct for every existing entrypoint, but the
  desktop app's sidecar deliberately sets cwd to a per-user app-data
  directory (for .env/DB persistence, from hdl-desktop-app), so the real
  policy file couldn't be found there. This affected not just the new
  read-only dashboard panel but the scored routing strategy itself, which
  also calls PolicyLoader.load() with no override.

  Fixed by mirroring the exact precedent hdl-docs-viewer already
  established for the same class of problem (HEIMDALL_REPO_ROOT taking
  precedence over cwd) -- and by staging config/ into the bundled resource
  directory in build-resources.sh, since the file didn't physically exist
  there at all, path fix or not. Confirmed fixed live: reinstalled the real
  .app bundle and curled /routing-policy through it successfully.

  The path-resolution logic was factored into a small pure function
  (resolveDefaultPolicyPath) specifically so this class of bug is
  unit-testable going forward -- the original inline module-level constant
  couldn't be regression-tested since process.env is read once at import
  time.

