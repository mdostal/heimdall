name: hdl-policy-path-fix
title: Fix PolicyLoader's default path against the desktop app's cwd redirection
target_codebase: /Users/mdostal/Documents/work/pantheon/heimdall
methodology: classic
version_bump: minor
sidecar_retention: transient

git_flow:
  base_branch: dev
  branch_strategy: per-epic

planning_team:
  matched_tags: [bug-fix, cross-epic-interaction]
  roster: []
  per_tag_reasoning:
    bug-fix: a real, confirmed-live defect, not a design choice.
    cross-epic-interaction: two independently-correct epics (hdl-desktop-app's cwd redirection, hdl-routing-policy-dashboard's cwd-relative default path) combined into a real bug neither one alone would have had.
  confidence: high
  gate_decisions:
