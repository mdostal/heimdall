description: |
  Formalize docs/decisions/DEC-hdl-role-actuation.md — the decision ID
  docs/heimdall-role-and-actuation.md cites as its own decision of record,
  which never actually existed as a file. Records: the corrected Multica API
  facts (max_concurrent_tasks is the real lever, not status/archive; two
  distinct Multica instances — local dev vs. the hive's :8090; workspace_id
  is mandatory), all 4 resolved open questions from design discussion
  (explicit env-var lane->agent mapping behind a resolver interface,
  StubControlAdapter default for unmapped lanes, no advisory-surface
  renaming, idempotent log-and-continue with Argus metrics on partial
  failure), and the flaky-connection hardening requirements (timeout,
  explicit unreachable state, circuit breaker) — reflecting what was
  actually built across hda-01 through hda-04, not just the original plan.

acceptance_criteria:
  - "Given docs/decisions/DEC-hdl-role-actuation.md, when read, then it
     documents the corrected max_concurrent_tasks-not-status/archive finding,
     the mandatory workspace_id requirement, and the two-distinct-Multica-
     instances distinction (local dev vs. the hive's :8090)."
  - "Given the doc, when read, then all 4 resolved open questions from
     design-discussion.md are recorded as decisions, not left as open
     questions."
  - "Given the doc, when read, then it explicitly states real end-to-end
     verification against the live hive :8090 instance is a follow-up step
     run by the operator after this epic ships, not part of this epic."

