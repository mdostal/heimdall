    agent: tester
    depends_on: [implement]
  - id: review
    description: Review that StubControlAdapter genuinely reuses ActuationStub rather than duplicating its transition-detection logic.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

