id: hda-02-lane-agent-resolver-stub-adapter
epic: hdl-actuation
title: "LaneAgentResolver + ControlAdapter interface + StubControlAdapter"
status: pending
complexity: low
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: src/core/actuation/lane-agent-resolver.ts
    change: new — LaneAgentResolver interface + StaticLaneAgentResolver (env-driven)
  - file: src/core/actuation/control-adapter.ts
    change: new — ControlAdapter interface + StubControlAdapter (wraps hdl-04's ActuationStub)

description: |
  Two small, independent pieces: (1) resolving a lane_id to its Multica
  agent ID(s) via explicit env config (HEIMDALL_LANE_<N>_MULTICA_AGENT_IDS,
  comma-separated) behind a LaneAgentResolver interface, so a v2 auto-
  discovery resolver can drop in later without touching any control-adapter
  code; (2) the ControlAdapter interface (reconcile(lane, status), called
  every sense-loop tick for every lane) plus StubControlAdapter, which wraps
  the existing ActuationStub (hdl-04) unchanged — loud logging on genuine
  transitions only, for any lane with no Multica agent mapping.

acceptance_criteria:
  - "Given HEIMDALL_LANE_1_MULTICA_AGENT_IDS=agent-a,agent-b, when
     StaticLaneAgentResolver.resolve('lane-1-id') is called (mapped via the
     lane's declared index), then it returns ['agent-a', 'agent-b']."
  - "Given a lane with no HEIMDALL_LANE_<N>_MULTICA_AGENT_IDS declared, when
     resolved, then it returns an empty array — not an error, not undefined."
  - "Given StubControlAdapter.reconcile(lane, status) is called across a
     genuine status transition, when observed, then it logs loudly exactly
     once for that transition (reusing hdl-04's ActuationStub transition
     logic) and never for repeated identical status."

steps:
  - id: implement
    description: |
      Implement lane-agent-resolver.ts (interface + StaticLaneAgentResolver
      parsing comma-separated env values) and control-adapter.ts (ControlAdapter
      interface + StubControlAdapter wrapping ActuationStub from hdl-04).
    agent: developer
  - id: test
    description: |
