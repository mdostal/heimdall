design_decisions:
  - decision: "LaneAgentResolver is its own interface, separate from ControlAdapter"
    rationale: "Resolved design discussion Open Question #1 — keeps 'which agents does this lane map to' decoupled from 'what do I do about it', so a v2 discovery-based resolver drops in without touching the control adapter."
  - decision: "Unmapped lanes get StubControlAdapter, never silent no-op"
    rationale: "Resolved Open Question #2 — visible/debuggable behavior over silent inaction."

