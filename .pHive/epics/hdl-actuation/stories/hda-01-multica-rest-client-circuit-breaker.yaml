design_decisions:
  - decision: "MULTICA_BASE_URL and MULTICA_WORKSPACE_ID have no code-baked default"
    rationale: "The hive's base URL and workspace ID are deployment-specific facts, not universal defaults — silently defaulting to localhost would be actively wrong when not co-located on the hive."
  - decision: "Every call resolves to a MulticaCallResult, never throws"
    rationale: "Hard requirement: the hive connection is known-flaky; a hung/failed call must not hang or crash Heimdall's sense loop."

cross_cutting:
  - concern: documentation
    action: ".env.example gains MULTICA_BASE_URL, MULTICA_WORKSPACE_ID, and the Multica PAT credential_ref documentation."

risks:
  - severity: high
    description: "Highest-risk piece of the epic — a bug in timeout/circuit-breaker handling could hang Heimdall's entire sense loop on a bad hive connection, the exact failure mode this epic exists to prevent."
    mitigation: "Explicit tests for every failure mode (timeout, network error, http error, circuit open) resolving gracefully, never throwing; review step specifically checks for escape paths."

references:
  - path: .pHive/epics/hdl-actuation/docs/design-discussion.md
    relevant_excerpt: |
      Flaky-connection requirements (HARD, non-negotiable): every Multica
      call gets a short timeout; a hung or failed hive call must NOT hang or
      crash Heimdall's sense loop... Circuit-break after repeated
      consecutive failures.
