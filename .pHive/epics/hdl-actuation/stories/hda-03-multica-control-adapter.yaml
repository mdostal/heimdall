      purpose: "existing in-process state-tracking pattern (corroboration Map) this story's last-applied-state tracking mirrors"

design_decisions:
  - decision: "In-process Map for last-applied state per agent, not persisted to SQLite"
    rationale: "Same accepted tradeoff as lane-pipeline.ts's corroboration state — restart loses memory of 'what was applied', which just means one extra reconcile cycle re-establishes it; not persisting keeps this simple and consistent with existing precedent."
  - decision: "Idempotent reconcile every tick, not gated by external transition-detection"
    rationale: "Resolved design discussion Open Question #4 — a failed attempt must retry 'for free' on the next tick regardless of whether THIS tick's status is a fresh transition."

cross_cutting:
  - concern: documentation
    action: "Document the reconcile-every-tick + idempotent-retry design in code comments referencing this story."

risks:
  - severity: high
    description: "Most behaviorally subtle piece of the epic — a bug could fail to disable an unhealthy lane's agents (defeats the whole point) or fail to restore a healthy one's (leaves agents permanently disabled)."
    mitigation: "Explicit tests for the disable-then-restore round trip remembering the EXACT prior value, and for retry-without-new-transition."

references:
  - path: .pHive/epics/hdl-actuation/docs/design-discussion.md
    relevant_excerpt: |
      MulticaControlAdapter ... tracks last-successfully-applied
      max_concurrent_tasks per agent; each tick, compares desired state ...
      against last-applied, and only calls the API when they differ OR the
      previous attempt failed (the mismatch simply persists until a call
      succeeds — no extra "retry" bookkeeping needed).
