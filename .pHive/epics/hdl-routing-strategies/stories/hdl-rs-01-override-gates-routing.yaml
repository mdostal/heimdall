id: hdl-rs-01-override-gates-routing
epic: hdl-routing-strategies
title: manual_override gates /available-route candidacy (block usage, direct it around)
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  getAvailableRoute's candidate filter currently reads only the sensed
  status (store.getAllCurrentStatuses()), never manual_override — an
  operator disabling a lane via the dashboard has zero effect on routing
  today. Fixes this using the exact override-wins-outright precedence
  already proven in MulticaControlAdapter.reconcile() (hdl-lane-override):
  override "disabled" -> never a routing candidate regardless of sensed
  status; override "enabled" -> always a candidate, bypassing the
  sensed-status check; override unset (null) -> today's status === "up"
  check, unchanged. Independent of which strategy is active — ships as
  its own real value ("block the usage and direct it around") before any
  strategy-selection work lands.

acceptance_criteria:
  - "Given a lane with sensed status 'up' and manual_override 'disabled', when GET /available-route is called for a task type that would otherwise pick it, then that lane is NEVER returned — routing goes to the next eligible candidate, or null if none remain"
  - "Given a lane with sensed status 'down' and manual_override 'enabled', when GET /available-route is called, then that lane IS a valid candidate despite the down status — override wins outright, matching MulticaControlAdapter's precedence exactly"
  - "Given a lane with manual_override unset (null), when GET /available-route is called, then behavior is byte-identical to pre-this-story — sensed status === 'up' alone decides"
  - "Every existing http-server.test.ts /available-route test (which never sets an override) passes with ZERO test changes — proves the unset-override case is truly unchanged"

steps:
  - id: research
    description: Confirm getAvailableRoute's exact current candidate-filter code and MulticaControlAdapter's override-precedence formula before implementing the mirrored version
    agent: researcher
  - id: implement
    description: Add the override-aware candidacy filter to getAvailableRoute (or a small extracted helper), reading store.getManualOverride() per lane
    agent: developer
    depends_on: [research]
  - id: test
    description: Add direct tests for the override-gates-candidacy behavior; confirm existing /available-route tests pass unmodified
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review specifically that the unset-override path is provably unchanged (the zero-test-change acceptance gate)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

