    change: "Widen the candidate filter to read store.getManualOverride(lane.lane_id) per lane and apply the override-wins-outright precedence before (or instead of) the sensed status === 'up' check."

code_examples:
  - title: The current candidate filter (sensed status only)
    file: src/core/route-selector.ts
    snippet: |
      const candidates = registry
        .list()
        .filter((lane) => lane.credential !== null)
        .filter((lane) => statuses.get(lane.lane_id)?.status === "up")
        .sort((a, b) => {...});

  - title: The precedence formula being mirrored (hdl-lane-override)
    file: src/core/actuation/multica-control-adapter.ts
    snippet: |
      const desiredEnabled =
        context?.manualOverride != null
          ? context.manualOverride === "enabled"
          : !SUSPECT_STATUSES.has(status);

design_decisions:
  - decision: Reuse the exact override-wins-outright precedence from MulticaControlAdapter rather than inventing new semantics for routing.
    rationale: One mental model for what "override" means across the whole codebase — an operator who disables a lane expects it blocked everywhere (actuation AND routing), not two different behaviors depending on which subsystem is asked.

cross_cutting:
  - concern: documentation
    action: "README's /available-route description gains a note that manual_override now affects candidacy."

risks:
  - severity: low
    description: A regression here would silently route traffic to a lane the operator explicitly disabled.
    mitigation: Direct acceptance criteria cover both override states explicitly, not just the unset case.

