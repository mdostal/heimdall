id: hdl-or-03-dashboard-gateway-grouping
epic: hdl-openrouter-signals
title: Dashboard groups lanes sharing a gateway credential, shows each route's model
status: completed
complexity: medium
methodology: classic
depends_on: [hdl-or-02-wire-openrouter-provider]

description: |
  Makes the "nesting" visible, not just structurally supported. GET /lanes
  (getLaneStatuses in http-server.ts) gains two fields on
  LaneStatusWithOverride -- model and credential_ref -- both read from the
  in-memory registry via registry.get(status.lane_id), mirroring the exact
  pattern credential_configured already uses (no new DB column;
  credential_ref is an env-var NAME, not a secret, same non-sensitive
  category as lane_id/provider). Dashboard groups lane rows by
  credential_ref: when more than one lane shares a credential_ref, they
  render under one gateway header (e.g. "OpenRouter (OPENROUTER_TOKEN)")
  with each route's model shown; a credential_ref used by exactly one lane
  renders exactly as it does today -- zero visual change for Claude/Codex/
  Gemini/Kimi lanes, which never share a credential.

acceptance_criteria:
  - "Given GET /lanes, when the response is inspected, then every lane object includes model and credential_ref fields"
  - "Given credential_configured is already boolean-only for secret hygiene, when credential_ref is added, then it carries only the env-var NAME (e.g. 'OPENROUTER_TOKEN'), never a resolved secret value"
  - "Given two or more lanes share the same credential_ref, when the dashboard renders, then those lanes appear grouped under one gateway header, each showing its own model"
  - "Given a credential_ref used by exactly one lane (every existing Claude/Codex/Gemini/Kimi lane in today's test fixtures), when the dashboard renders, then that lane's row is visually IDENTICAL to its pre-this-story rendering -- zero DOM/visual change for the non-nested case"
  - "Every existing dashboard.test.ts / http-server.test.ts case covering GET /lanes passes with ZERO test changes for the non-grouped case"

steps:
  - id: research
    description: Confirm getLaneStatuses's exact registry-lookup pattern (credential_configured) and dashboard.ts's current renderRow structure
    agent: researcher
  - id: implement
    description: Add model/credential_ref to LaneStatusWithOverride; implement dashboard grouping logic (group-by-credential_ref, single-member groups render unchanged)
    agent: developer
    depends_on: [research]
  - id: test
    description: Add tests for the new GET /lanes fields, the grouped-rendering case, and an explicit zero-change assertion for the ungrouped case
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review that credential_ref never carries a resolved secret, and that ungrouped rendering is provably unchanged (the zero-test-change acceptance gate)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

