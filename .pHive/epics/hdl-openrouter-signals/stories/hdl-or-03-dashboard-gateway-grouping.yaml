design_decisions:
  - decision: credential_ref (the env-var name) is safe to expose in GET /lanes, unlike the resolved secret it names.
    rationale: "Matches the existing REQ-07 invariant precedent (credential_configured already distinguishes 'is this lane's secret set' from the secret itself) -- credential_ref is metadata about WHERE a secret lives, not the secret."
  - decision: Grouping is computed client-side from the flat GET /lanes response, not a new grouped API shape.
    rationale: "Keeps the HTTP contract flat and simple (existing MCP tools/CLI consumers of GET /lanes are unaffected) -- the dashboard is the only consumer that needs the grouped view, so it does the grouping."

risks:
  - severity: low
    description: A future lane accidentally reusing another lane's credential_ref (typo, not a real gateway) would visually group them, implying a relationship that isn't intended.
    mitigation: "This is an honest reflection of the data -- if two lanes truly share a credential, grouping them is correct information, not a false claim. Not treated as a defect."

