files_to_modify:
  - file: src/core/lane-registry.ts
    change: "Parse optional HEIMDALL_LANE_<N>_PRIORITY into LaneDeclaration/Lane's new optional priority?: number field; invalid values fall back to unset rather than throwing."
  - file: src/core/routing-strategies/priority-strategy.ts
    change: "runtimeRank (or a new small wrapper) checks lane.priority first, using it directly as the sort key when present, before falling back to the table-driven RUNTIME_PRIORITY lookup."
  - file: src/api/ui/dashboard.ts
    change: "Show a small priority badge/indicator on any lane with an explicit priority override set."

design_decisions:
  - decision: An explicit lane priority applies across ALL task types uniformly, not per-task-type.
    rationale: "Per-task-type override would need a new declaration shape (one value per task type) for a need that hasn't been demonstrated yet -- a single override value is the minimal change that satisfies 'control what routes it gets', consistent with this codebase's repeated preference for the smallest change that closes a confirmed gap."
  - decision: Priority is compared on the SAME numeric scale runtimeRank already produces (0..table-length), not a separate namespace.
    rationale: "Avoids introducing a second ranking scale and a normalization step between them -- an operator setting priority=0 is knowingly competing directly with the highest table-ranked providers, which is exactly the intent of 'control what routes it gets'."

risks:
  - severity: low
    description: An operator could set priority values that produce confusing results if they don't understand the underlying 0..N table scale.
    mitigation: "Dashboard badge makes any active override visible; documented in-file with the exact scale semantics."

references:
  - path: .pHive/epics/hdl-openrouter-signals/docs/design-discussion.md
    relevant_excerpt: |
      Adds an optional HEIMDALL_LANE_<N>_PRIORITY=<int> declaration (mirrors
      manual_override's override-wins-outright shape): when set, it replaces
      runtimeRank's output for that lane entirely; when unset, ranking is
      byte-identical to today.
