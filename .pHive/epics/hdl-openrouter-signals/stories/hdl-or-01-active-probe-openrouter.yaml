design_decisions:
  - decision: "Check limit_remaining <= 0 on a 200 response in addition to handling an explicit 402, rather than assuming only one shape is real."
    rationale: "The docs fetched for this epic don't confirm whether GET /api/v1/key itself ever 402s at zero balance, or always returns 200 with limit_remaining: 0 -- handling both defensively costs nothing and avoids silently missing a real out-of-credit lane."

risks:
