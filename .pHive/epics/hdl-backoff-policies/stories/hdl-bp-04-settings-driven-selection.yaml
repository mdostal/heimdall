    - src/core/scheduler/in-process-scheduler.ts
    - src/api/http-server.ts
  tech_stack: [typescript, node, sqlite]

design_decisions:
  - decision: BACKOFF_POLICY_SETTING_KEY/getActiveBackoffPolicyName live
      in the core scheduler/backoff-policies layer, not http-server.ts.
    rationale: Found during this epic's own collaborative-review pass —
      the real routing_strategy pattern already splits ownership this way
      (ROUTING_STRATEGY_SETTING_KEY/getActiveRoutingStrategyName in
      src/core/route-selector.ts, only setRoutingStrategy + HTTP handlers
      in http-server.ts); an earlier draft wrongly attributed the whole
      pattern to http-server.ts.
  - decision: Per-provider override replaces the whole policy choice
      rather than overriding individual parameters of the global policy.
    rationale: Design-discussion open question 1 — a provider needing a
      genuinely different heuristic (e.g. Ollama, which never rate-limits,
      reasonably wanting static even when the global default is
      exponential) is the more likely real use case than wanting the same
      heuristic with different numbers.

metric:
