description: >
  The pluggable backoff heuristic itself — pure functions, no I/O, no
  scheduler coupling — mirroring src/core/routing-strategies/'s real,
  existing pattern exactly (interface + one-file-per-strategy + registry
  factory). Ships 3 policies: static (flat interval, today's behavior),
  progressive (linear step growth capped at levelCap), exponential-
  progressive (multiplicative growth with a mandatory ceiling). Nothing in
  this story wires into the running scheduler yet — that's hdl-bp-03.

acceptance_criteria:
  - BackoffPolicy interface: nextDelayMs(ctx) where ctx =
    {consecutiveSuspectTicks, baseIntervalMs, config}. No errorCode or
    resetAt in context (those are pre-policy invariants, handled in
    hdl-bp-03, not policy inputs).
  - consecutiveSuspectTicks is documented and implemented as 1-indexed —
    the first suspect tick passes 1, not 0.
  - static returns baseIntervalMs unconditionally.
  - progressive returns baseIntervalMs * min(consecutiveSuspectTicks,
    levelCap), levelCap default 10.
  - exponential-progressive returns min(baseIntervalMs * multiplier **
    (consecutiveSuspectTicks - 1), ceilingMs); ceilingMs is a required
    config field, never optional/unbounded.
  - createBackoffPolicyRegistry() returns all 3, keyed by name
    ("static"|"progressive"|"exponential").
  - Unit tests independently re-derive the design-discussion's worked
    wall-clock numbers (exponential reaches the 300s ceiling at tick 7 at
    multiplier=2/ceilingMs=300_000/baseIntervalMs=5_000; progressive
    reaches its 50s cap at tick 10 at levelCap=10/baseIntervalMs=5_000),
    not just assert them.

