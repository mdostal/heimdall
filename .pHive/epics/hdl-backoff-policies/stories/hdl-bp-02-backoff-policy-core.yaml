design_decisions:
  - decision: consecutiveSuspectTicks is 1-indexed, and exponential's
      formula uses (consecutiveSuspectTicks - 1) as its exponent.
    rationale: Found during this epic's own collaborative-review pass — an
      earlier draft's two formulas silently assumed different indexing
      conventions and produced numbers that didn't actually match. 1-indexed
      with the -1 exponent makes the first suspect tick (consecutiveSuspectTicks=1)
      yield exactly baseIntervalMs for every policy, matching static's
      first delay, and reproduces the design-discussion's worked numbers
      exactly, independently re-derivable.
  - decision: ceilingMs is a required, not optional, config field for
      exponential-progressive.
    rationale: Operator's own explicit instruction — "say when to stop so
      put a limit on it" — an unbounded exponential backoff was never on
      the table.

