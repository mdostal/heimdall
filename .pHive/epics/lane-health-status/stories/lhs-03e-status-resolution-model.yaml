id: lhs-03e-status-resolution-model
epic: lane-health-status
title: "4-state status resolution model (REQ-04) — pure function, no adapters, no I/O"
status: pending
complexity: low
methodology: classic
depends_on: [lhs-01-service-skeleton-fixture-http]
parallel_allowed: true
parallel_rationale: bounded-slice
files_to_modify:
  - file: src/core/status-model.ts
    change: "extend the type-only shape from lhs-01 with the full 4-state resolution function"

description: |
  Implement status-model.ts's resolution logic: given a raw signal (from
  whichever source lhs-03d chose), resolve it to exactly one of the 4 states
  (up / down / out_of_credit with reset_at / degraded). This is a pure
  function — no adapters, no I/O, no knowledge of Claude/Codex specifically.
  Can be built and unit-tested in complete isolation from lhs-03a/03b/03c/03d,
  against the same input/output shapes defined in architecture.md. Split out
  per operator request (2026-07-25).

acceptance_criteria:
  - "Given a raw signal input, when status is computed, then it resolves to
     exactly one of: up, down, out_of_credit (with reset_at if known), or
     degraded (REQ-04)."
  - "Given a signal indicating out_of_credit and a reset time becomes known,
     when resolved, then reset_at is included in the output (REQ-04)."
  - "Given an ambiguous or malformed signal input, when resolved, then the
     function returns a defined fallback state rather than throwing."

steps:
  - id: implement
    description: |
      Extend src/core/status-model.ts with the resolution function:
      (rawSignal) => { status, reset_at | null, reason | null }.
    agent: developer
  - id: test
    description: |
      Unit tests covering all 4 output states, the reset_at-present case, and
      the malformed-input fallback case.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for purity (no I/O, no provider-specific branching) and exhaustive state coverage.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

