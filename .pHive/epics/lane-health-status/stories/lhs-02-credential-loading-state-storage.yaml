id: lhs-02-credential-loading-state-storage
epic: lane-health-status
title: "Real credential loading (REQ-07) + SQLite state storage"
status: pending
complexity: medium
methodology: classic
depends_on: [lhs-01-service-skeleton-fixture-http]
files_to_modify:
  - file: src/core/credential-source.ts
    change: new — CredentialSource interface + local .env/vault implementation
  - file: src/core/lane-registry.ts
    change: new — loads configured lanes + their CredentialSource
  - file: src/core/state-store.ts
    change: new — SQLite schema (lanes, lane_status_history) + read/write
  - file: src/api/http-server.ts
    change: "replace fixture array with state-store-backed data (still placeholder status values, no real signal yet)"
  - file: .env.example
    change: new — documents the expected local credential file shape (never commit the real .env)
  - file: README.md
    change: "add a Credentials section documenting the local .env/vault format"

description: |
  Replace lhs-01's hardcoded fixture with real local credential loading
  (REQ-07) and persistent SQLite state storage per architecture.md's data
  model. Lanes are now loaded from a real local `.env`/vault file, one entry
  per lane, and their status is read from/written to SQLite instead of an
  in-memory array. Status values are still static placeholders — no real
  signal detection yet (that's lhs-03). This is Vertical Slice 2.

acceptance_criteria:
  - "Given a lane's credential is present in the local .env/vault stopgap,
     when Heimdall starts, then that lane is loadable and probeable (REQ-07)."
  - "Given a lane's credential is missing or invalid, when Heimdall starts,
     then that lane is reported as down/unconfigured rather than crashing the
     whole service (REQ-07)."
  - "Given a lane status is written to lane_status_history, when the same lane
     is queried again, then the current status is read as the latest row per
     lane_id (architecture.md data model)."

steps:
  - id: research
    description: Confirm architecture.md's SQLite schema and CredentialSource interface shape.
    agent: researcher
  - id: implement
    description: |
      Implement credential-source.ts (interface + local .env/vault loader),
      lane-registry.ts, state-store.ts (SQLite schema + read/write), and wire
      http-server.ts to read from state-store instead of the Slice 1 fixture.
      Add .env.example and a README Credentials section.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Unit tests: missing/invalid credential -> down/unconfigured status, no
      crash; state-store read/write round-trips; "current status = latest row"
      semantics hold.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for REQ-07 acceptance criteria and schema fidelity against architecture.md.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/heimdall
  tech_stack:
    languages: [typescript]
  key_files:
    - path: .pHive/planning/architecture.md
      purpose: "canonical SQLite schema (lanes, lane_status_history) and CredentialSource swappable-interface design"
    - path: .pHive/planning/prd.md
      purpose: "REQ-07 acceptance criteria this story implements directly"

design_decisions:
  - decision: "Local .env/vault file, one entry per lane, behind a swappable CredentialSource interface"
    rationale: "Deferred-Portunus stopgap per product-brief.md P2 scope — swapping in Portunus later must not touch calling code."
  - decision: "SQLite over Postgres/external DB"
    rationale: "Local-first constraint from discovery; zero ops burden at this scale."

cross_cutting:
  - concern: documentation
    action: ".env.example + README Credentials section document the local vault format introduced by this story."

risks:
  - severity: low-medium
    description: "First real I/O (file-based credentials, SQLite) — no external network calls yet, so risk is contained to local file/DB handling."
    mitigation: "Unit tests cover the missing/invalid-credential path explicitly since REQ-07 requires graceful degradation, not a crash."

references:
  - path: .pHive/planning/architecture.md
    relevant_excerpt: |
      CREATE TABLE lanes (lane_id TEXT PRIMARY KEY, provider TEXT NOT NULL,
      credential_ref TEXT NOT NULL); CREATE TABLE lane_status_history (...)
      Current status = latest row per lane_id in lane_status_history.
  - path: .pHive/planning/prd.md
    relevant_excerpt: |
      REQ-07: Minimal local credential loading for lane probes ... Given a
      lane's credential is missing or invalid, when Heimdall starts, then
      that lane is reported as down/unconfigured rather than crashing the
      whole service.
