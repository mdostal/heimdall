design_decisions:
  - decision: "Integration happens in its own story, after all five pieces are independently built and unit-tested"
    rationale: "Operator request (2026-07-25): decompose into the smallest possible pieces to reduce per-story failure surface, then bundle integration into one final wiring + full-integration-test story."

risks:
  - severity: medium
    description: "This is still the story where real Claude behavior gets exercised for the first time — even with all pieces unit-tested individually, integration can surface interface mismatches between them."
    mitigation: "Each of 03a-03e was built against the same architecture.md interface shapes, minimizing surprise; any mismatch found here should be fixed in the smallest affected piece, not patched over in this story."

