files_to_modify:
  - file: src/api/mcp-server.ts
    change: "Add 3 new tool name constants, 3 new descriptor entries, 3 new call*Tool functions wrapping hdl-mcp-01's shared functions, and a dispatch table replacing the single if-check in createMcpServer."

code_examples:
  - title: The existing single-tool pattern being extended to 4 tools
    file: src/api/mcp-server.ts
    snippet: |
      export const LANES_LIST_TOOL_NAME = "heimdall.lanes.list";

      export function callLanesListTool(registry: LaneRegistry, store: StateStore) {
        const lanes = getLaneStatuses(registry, store);
        return {
          content: [{ type: "text" as const, text: JSON.stringify(lanes) }],
        };
      }

      server.setRequestHandler(CallToolRequestSchema, async (request) => {
        if (request.params.name !== LANES_LIST_TOOL_NAME) {
          throw new Error(`Unknown tool: ${request.params.name}`);
        }
        return callLanesListTool(registry, store);
      });

design_decisions:
  - decision: Validation failures (unknown lane, invalid state, etc.) return structured text content, never throw; only a genuinely unknown tool NAME throws.
    rationale: Matches heimdall.lanes.list's existing never-throws-on-empty-data philosophy and REQ-07's down/unconfigured-is-data-not-exception pattern -- an agent gets one consistent error-handling shape across every Heimdall tool, not a special case for mutations.

cross_cutting:
  - concern: documentation
    action: "README's MCP section lists all 4 tools with their input shapes."

risks:
  - severity: low
    description: Forgetting to add a new tool to the dispatch table would silently make it uncallable despite being listed.
    mitigation: Acceptance criterion covers exactly this -- each new tool's callable path is asserted directly, not just its presence in listLaneToolsDescriptor().

