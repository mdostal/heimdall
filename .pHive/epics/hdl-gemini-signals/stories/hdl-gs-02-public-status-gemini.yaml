code_examples:
  - title: The PublicStatusSignal contract every public-status adapter returns
    file: src/core/signal-sources/public-status/claude.ts
    snippet: |
      export type PublicStatusValue = "up" | "degraded" | "down";
      export interface PublicStatusSignal {
        status: PublicStatusValue;
        reason: string | null;
      }

  - title: The fragment-match filtering pattern to adapt
    file: src/core/signal-sources/public-status/claude.ts
    snippet: |
      const RELEVANT_COMPONENT_NAME_FRAGMENTS = ["Claude Code", "API", "api.anthropic.com"];
      const relevant = summary.components.filter((component) =>
        RELEVANT_COMPONENT_NAME_FRAGMENTS.some((fragment) => component.name.includes(fragment)),
      );

design_decisions:
  - decision: "No matching open incident -> up (absence of a reported problem), rather than treating the lack of a positive 'operational' component as ambiguous."
    rationale: "incidents.json is fundamentally a problem-report feed, not a component-status snapshot -- there is no 'operational' entry to read even when everything is fine. Reading 'no open incident' as up is the correct interpretation of what this feed actually represents, matching how an operator reading the dashboard themselves would conclude health."
  - decision: "Fragment list kept narrow and documented in-file: [\"Gemini\", \"Vertex AI\", \"Generative AI\"]."
    rationale: "Same tradeoff claude.ts already accepts for its own fragment list -- narrow enough to avoid false-positives from unrelated GCP incidents (VMware, Bare Metal, NetApp, etc. dominate this feed), documented so a future contributor can tune it against real incident naming as more data comes in."

risks:
  - severity: medium
    description: "status.cloud.google.com/incidents.json is not a formally documented, stable API contract the way Claude's StatusPage.io feed is -- schema or field-naming drift is plausible."
    mitigation: "Defensive-default posture (unrecognized shape -> degraded, never up) bounds the blast radius of drift to false-degraded, not false-healthy. Revisit if the feed's shape changes."
  - severity: low
    description: "Fragment matching against affected_products[].title could under-match a real Gemini incident that's phrased differently than expected (e.g. a future product rename)."
    mitigation: "Same accepted tradeoff as claude.ts's own fragment list; documented in-file for easy tuning, not a blocking concern for this epic's scope."

