id: hdl-gs-02-public-status-gemini
epic: hdl-gemini-signals
title: Gemini public-status adapter (Google Cloud incidents feed, fragment-filtered)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implements src/core/signal-sources/public-status/gemini.ts, mirroring
  public-status/claude.ts's PublicStatusSignal contract and defensive
  posture (unreachable -> degraded, unrecognized shape -> degraded, never
  a silent "up" on ambiguity) but adapted to the real feed available for
  Gemini: status.cloud.google.com/incidents.json (no auth). Unlike
  Claude's fixed per-component snapshot, this is a flat, Google-Cloud-wide
  incident list -- there is no positive "operational" entry to read.
  Filter to currently-open incidents whose affected_products[].title
  matches one of a documented fragment list (mirroring claude.ts's
  RELEVANT_COMPONENT_NAME_FRAGMENTS pattern, adapted to the different
  field shape); no matching open incident means up. A matching incident's
  severity maps to degraded/down.

acceptance_criteria:
  - "Given a fetch of incidents.json with no open incident matching the Gemini/Vertex-AI fragment list, when checkGeminiPublicStatus is called, then it returns { status: 'up', reason: null }"
  - "Given an open incident (no end timestamp) whose affected_products includes a title matching one of the documented fragments, with severity indicating a partial/medium impact, when checkGeminiPublicStatus is called, then it returns { status: 'degraded', reason: '<incident name/description>' }"
  - "Given an open incident matching the fragment list with severity/status_impact indicating a full outage, when checkGeminiPublicStatus is called, then it returns { status: 'down', reason: '<incident name/description>' }"
  - "Given an incident matching the fragment list that has already ended (has an end timestamp in the past), when checkGeminiPublicStatus is called, then that incident is NOT treated as currently affecting status"
  - "Given the incidents.json endpoint is unreachable or returns a non-2xx response, when checkGeminiPublicStatus is called, then it returns { status: 'degraded', reason: '<explanation>' }, never throws, never silently returns 'up'"
  - "Given an incidents.json response with an unrecognized/malformed shape (schema drift), when checkGeminiPublicStatus is called, then it returns 'degraded', not 'up' -- ambiguity is never read as healthy"

