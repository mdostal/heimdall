id: hdl-gs-01-active-probe-gemini
epic: hdl-gemini-signals
title: Gemini active-probe adapter (models.list, x-goog-api-key header, quota-vs-rate-limit distinction)
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  Implements src/core/signal-sources/active-probe/gemini.ts, mirroring
  active-probe/claude.ts's shape and error-handling posture exactly
  (never-throws, injectable fetchImpl, same ProbeResult return type) but
  adapted to Gemini's actually-documented behavior (research-brief.md):
  GET generativelanguage.googleapis.com/v1beta/models, authenticated via
  the x-goog-api-key header (not the ?key= query param -- avoids leaking
  the credential into URLs/proxy logs, matching Claude's header-based
  pattern). Gemini's 429 body is {error: {code, message, status}} where
  status distinguishes a transient per-minute rate limit from a
  longer-lived daily-quota-exceeded condition -- map the former to
  "degraded" and the latter to "out_of_credit", same two-tier severity
  Claude's 402-vs-429 split gives. reset_at is ALWAYS null for Gemini --
  no documented reset-timestamp header/field exists for this API, unlike
  Claude's anthropic-ratelimit-requests-reset. This is a confirmed gap,
  not an oversight, and InProcessScheduler's existing reset_at-unknown
  fallback (hdl-reason-aware-recovery) already handles null reset_at
  correctly with zero new scheduler code.

acceptance_criteria:
  - "Given a 2xx response from models.list, when probeGeminiLane is called, then it returns { status: 'up', reset_at: null, reason: null }"
  - "Given a 401 or 403 response, when probeGeminiLane is called, then it returns { status: 'down', reset_at: null, reason: 'auth failed (<code>)' }"
  - "Given a 429 response whose body's error.status indicates a daily quota condition, when probeGeminiLane is called, then it returns { status: 'out_of_credit', reset_at: null, reason: <message> }"
  - "Given a 429 response whose body's error.status indicates a transient per-minute rate limit, when probeGeminiLane is called, then it returns { status: 'degraded', reset_at: null, reason: <message> }"
  - "Given a 5xx response, when probeGeminiLane is called, then it returns { status: 'down', reset_at: null, reason: 'server error (<code>)' }"
  - "Given a network-level fetch failure, when probeGeminiLane is called, then it never throws -- it returns { status: 'down', reset_at: null, reason: 'probe request failed: <message>' }"
  - "Given a successful call, when the request is inspected, then the API key appears in the x-goog-api-key header, never in the URL query string"

