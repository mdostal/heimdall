code_examples:
  - title: The ProbeResult contract every probe adapter returns
    file: src/core/signal-sources/active-probe/claude.ts
    snippet: |
      export type ProbeStatusValue = "up" | "down" | "out_of_credit" | "degraded";
      export interface ProbeResult {
        status: ProbeStatusValue;
        reset_at: string | null;
        reason: string | null;
      }

  - title: Never-throws network-failure handling to mirror
    file: src/core/signal-sources/active-probe/claude.ts
    snippet: |
      try {
        response = await fetchImpl(CLAUDE_MODELS_URL, { ... });
      } catch (err) {
        return {
          status: "down",
          reset_at: null,
          reason: `probe request failed: ${err instanceof Error ? err.message : String(err)}`,
        };
      }

design_decisions:
  - decision: reset_at is unconditionally null for Gemini, documented in a file-header comment exactly like claude.ts documents its own sourcing.
    rationale: "No live API confirms a reset-timestamp field exists on the Gemini Developer API's 429 responses (Vertex AI's RetryInfo/retryDelay is a different, unconfirmed-present API surface). Returning a fabricated or guessed reset_at would be worse than an honest null -- InProcessScheduler already degrades gracefully to its flat interval when reset_at is unknown."
  - decision: quota_exceeded maps to out_of_credit, rate_limit_exceeded maps to degraded, both under HTTP 429.
    rationale: "Mirrors the severity distinction Claude expresses via 402-vs-429 (a longer-lived billing/quota state vs a short transient rate limit), just read from the JSON body's error.status field instead of the HTTP status code, since Gemini collapses both cases onto 429."

risks:
  - severity: medium
    description: The exact string value of error.status for the two 429 sub-cases was not confirmed against a live exhausted-quota account (only documented in Google's error-code reference pages, which use both explicit enum-like names and prose descriptions inconsistently across pages).
    mitigation: "Match on the documented RESOURCE_EXHAUSTED status plus a message/reason substring check for quota-vs-rate-limit framing; default an unrecognized 429 body to 'degraded' (the less severe of the two) rather than guessing out_of_credit, so an unrecognized shape never over-triggers actuation. Revisit once a live 429 is observed in production."

references:
  - path: .pHive/epics/hdl-gemini-signals/docs/research-brief.md
    relevant_excerpt: |
      Two 429 sub-cases matter and are distinguished by `status`, not by
      HTTP code alone ... Gap: no reset timestamp ... reset_at must be
      null for every Gemini probe result.
