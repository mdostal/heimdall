design_decisions:
  - decision: "'No catalog data' (empty array) is treated distinctly from 'catalog data exists but this model isn't in it.'"
    rationale: "The former means 'never refreshed, we have no opinion' (must stay byte-identical to pre-epic behavior); the latter means 'we checked, and this model is either disabled or gone' -- a real signal worth acting on. Conflating them would either break every lane before its first refresh, or silently disable substitution forever."

risks:
  - severity: low
    description: A caller expecting /available-route's model to always equal the lane's raw declared value would see it change once catalog data exists and the declared model is disabled/gone.
    mitigation: "This is the explicit, operator-requested behavior (design-discussion.md's goal). GET /lanes still reports the raw declared model unchanged for any caller that needs it."

references:
  - path: .pHive/epics/hdl-model-catalog-routing/docs/design-discussion.md
    relevant_excerpt: |
      No catalog data at all for this provider ... declared model,
      unchanged. No data means no opinion.
