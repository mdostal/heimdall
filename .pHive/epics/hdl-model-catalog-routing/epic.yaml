description: >
  Wires hdl-model-catalog's live catalog into actual route selection.
  GET /available-route now returns a model that's confirmed usable --
  substituting the newest enabled model for a lane's provider when the
  declared HEIMDALL_LANE_N_MODEL is disabled or has vanished from the live
  catalog. "No catalog data yet" falls back to the declared model
  unchanged (byte-identical to pre-epic behavior) -- substitution only
  activates once an operator has refreshed at least once. Never silent:
  AvailableRoute gains a model_substituted boolean.

