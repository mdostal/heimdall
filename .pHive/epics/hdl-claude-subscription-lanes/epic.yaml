description: >
  Adds support for Claude Code long-lived OAuth tokens (sk-ant-oat01-...,
  from `claude setup-token`) alongside the existing raw Anthropic API key
  credential type, auto-detected by credential shape -- zero new
  provider/config surface. Confirmed via web research that Anthropic's
  Messages API rejects this token type directly (scoped to the genuine
  Claude Code client), so the correct integration path is shelling out to
  the real claude CLI's `auth status --json` subcommand -- a zero-cost,
  official liveness check, verified live against the actual long-lived
  token configured on the hive before this epic was planned. Reuses the
  existing CommandRunner pattern already established for Multica.

