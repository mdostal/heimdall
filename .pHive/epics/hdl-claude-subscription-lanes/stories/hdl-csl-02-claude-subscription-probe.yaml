id: hdl-csl-02-claude-subscription-probe
epic: hdl-claude-subscription-lanes
title: probeClaudeLane auto-detects and dispatches to a CLI-based subscription-token check
status: pending
complexity: medium
methodology: classic
depends_on: [hdl-csl-01-command-runner-env-support]

description: |
  Splits active-probe/claude.ts's probeClaudeLane into a credential-shape
  dispatcher. Credentials starting with "sk-ant-oat01-" (Claude Code
  long-lived OAuth tokens, from `claude setup-token`) route to a new
  probeClaudeSubscriptionLane, which shells out to `claude auth status
  --json` with CLAUDE_CODE_OAUTH_TOKEN set to the credential for that one
  call (via hdl-csl-01's env-override support), parses { loggedIn,
  authMethod }, and maps loggedIn:true -> up, loggedIn:false -> down, any
  exec/parse failure -> down (never throws). Everything else (existing raw
  API keys) routes to today's unchanged HTTP-based logic, renamed
  probeClaudeApiKeyLane internally. No degraded/out_of_credit path for
  subscription lanes -- auth status reveals login validity only, not
  usage/rate-limit state; an honest, documented gap.

acceptance_criteria:
  - "Given a credential starting with 'sk-ant-oat01-', when probeClaudeLane is called, then it dispatches to the CLI-based subscription check, never the HTTP path"
  - "Given any other credential shape (including today's existing raw API key format), when probeClaudeLane is called, then it dispatches to the unchanged HTTP path -- ZERO test changes to any existing active-probe/claude.test.ts case covering the API-key path"
  - "Given a CommandRunner whose run() resolves with stdout containing { \"loggedIn\": true, \"authMethod\": \"oauth_token\" }, when the subscription probe runs, then it returns { status: 'up', reset_at: null, reason: null }"
  - "Given a CommandRunner whose run() resolves with stdout containing { \"loggedIn\": false }, when the subscription probe runs, then it returns { status: 'down', reason: <mentions not logged in> }"
  - "Given a CommandRunner whose run() rejects (CLI not found, non-zero exit), when the subscription probe runs, then it never throws -- returns { status: 'down', reason: <explanatory message> }"
  - "Given a CommandRunner whose run() resolves with malformed/non-JSON stdout, when the subscription probe runs, then it returns { status: 'down' }, never guesses 'up'"
  - "Given the real claude CLI and a real (test-only, injected via env at test time, never hardcoded/committed) long-lived token, when probeClaudeSubscriptionLane is exercised as a manual smoke test, then it correctly reports 'up' -- documented as a manual verification step, not a committed automated test (no real credential belongs in the test suite)"

steps:
  - id: research
    description: Confirm the exact claude auth status --json output shape and CommandRunner's new env-override API from hdl-csl-01
    agent: researcher
  - id: implement
    description: Split probeClaudeLane into the dispatcher + probeClaudeApiKeyLane (renamed, unchanged logic) + new probeClaudeSubscriptionLane
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit tests covering every acceptance criterion using a fake CommandRunner; confirm zero changes to existing API-key-path tests
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review that no real credential ever appears in committed test fixtures, and that the dispatcher's shape-detection is the ONLY branch point (no duplicated logic between the two paths)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch; run full local test suite + tsc build as final gate before PR
    agent: developer
    depends_on: [review]

