code_examples:
  - title: The never-throws exec-failure handling pattern to mirror
    file: src/core/scheduler/multica-autopilot-scheduler.ts
    snippet: |
      try {
        multicaScheduler.start();
      } catch (err) {
        console.error(`[multica-autopilot-scheduler] failed to register autopilot for lane ${lane.lane_id}: ${err}`);
        // per-lane failure isolation -- one lane's bad config never crashes the whole service
      }

design_decisions:
  - decision: "sk-ant-oat01- prefix is the sole detection signal -- no separate config flag."
    rationale: "The token format itself is the ground truth of which auth mechanism applies; a separate flag would be redundant config that could drift out of sync with the actual credential value."
  - decision: No real credential is ever committed to the test suite, even as a fixture.
    rationale: "The manual smoke-test acceptance criterion is explicitly NOT a committed automated test -- matches this session's established practice of testing live systems via ad-hoc verification (isolated temp .env, SSH-fetched values never displayed) rather than embedding secrets in the repo."

risks:
  - severity: low
    description: claude auth status --json's exact field names/shape could change across CLI versions.
    mitigation: "Malformed/unrecognized JSON maps to down, never a silent up -- same accepted-drift posture as every external CLI/API dependency in this codebase."

