code_examples:
  - title: The interface and implementation being extended
    file: src/core/scheduler/command-runner.ts
    snippet: |
      export interface CommandRunner {
        run(command: string, args: string[]): Promise<CommandResult>;
      }
      export class NodeCommandRunner implements CommandRunner {
        async run(command: string, args: string[]): Promise<CommandResult> {
          const { stdout, stderr } = await execFileAsync(command, args);
          return { stdout, stderr };
        }
      }

design_decisions:
  - decision: The env override is ADDITIVE (merged with process.env), not a full replacement.
    rationale: "A full replacement would require every caller to re-specify PATH and every other variable the subprocess needs to function at all -- additive matches how execFile's own options.env behaves when you want to add one variable, and matches the principle of least surprise for the one real caller (hdl-csl-02) that needs exactly one extra variable set."

risks:
  - severity: low
    description: None beyond the standard low-risk additive-extension class already established by manual_override/manual_reset_at/priority's precedent in this codebase.
    mitigation: "Optional parameter, default-omitted behavior unchanged, direct test coverage for both shapes."

