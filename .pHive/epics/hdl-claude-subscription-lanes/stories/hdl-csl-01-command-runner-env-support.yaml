id: hdl-csl-01-command-runner-env-support
epic: hdl-claude-subscription-lanes
title: CommandRunner supports per-call environment variable overrides
status: completed
complexity: low
methodology: classic
depends_on: []

description: |
  Extends CommandRunner.run() with an optional third parameter:
  run(command, args, options?: { env?: Record<string, string> }). When
  provided, NodeCommandRunner passes { ...process.env, ...options.env } to
  execFile; when omitted, behavior is byte-identical to today (execFile
  inherits process.env as-is, matching the current implementation exactly).
  Needed by hdl-csl-02 to scope CLAUDE_CODE_OAUTH_TOKEN to a single
  subprocess call without touching Heimdall's own process.env or leaking
  the token to unrelated subprocess calls (e.g. MulticaAutopilotScheduler's
  own multica CLI invocations).

acceptance_criteria:
  - "Given CommandRunner.run(command, args) is called with no third argument, when NodeCommandRunner executes it, then behavior is byte-identical to pre-this-story -- ZERO test changes to any existing MulticaAutopilotScheduler test that calls run() with 2 args"
  - "Given CommandRunner.run(command, args, { env: { FOO: 'bar' } }) is called, when NodeCommandRunner executes it, then the spawned subprocess sees FOO=bar in its environment, in addition to (not instead of) the parent process's existing environment variables"
  - "Given a custom env override is passed, when the subprocess runs, then Heimdall's own process.env is provably unmodified -- the override is scoped to that one execFile call only"

steps:
  - id: implement
    description: Add the optional third parameter to CommandRunner's interface and NodeCommandRunner's implementation
