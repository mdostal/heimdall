design_decisions:
  - decision: Load once on page load, not on the 5s lane-status poll interval.
    rationale: "Mirrors the routing-strategy panel's already-documented reasoning exactly — a config-browsing/editing surface, not a live status row; re-rendering checkboxes under an operator's cursor every 5s would be actively annoying."
  - decision: No backend changes — pure consumer of the already-shipped GET/POST /models surface.
    rationale: "hdl-model-catalog (slice 1) already built the full query/mutation surface; this slice is exclusively presentation."

