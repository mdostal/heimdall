  codebase: /Users/mdostal/Documents/work/pantheon/heimdall
  tech_stack:
    language: typescript
    runtime: node
    test_runner: "node:test via tsx"
  key_files:
    - path: src/core/scheduler/in-process-scheduler.ts
      purpose: "The file being changed — poll()/scheduleNext() currently use a flat DEFAULT_INTERVAL_MS (line 31) regardless of reset_at"
    - path: src/core/scheduler/in-process-scheduler.test.ts
