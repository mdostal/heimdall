id: hdl-rar-01-scheduler-reset-at
epic: hdl-reason-aware-recovery
title: InProcessScheduler retries at reset_at instead of a flat 5s interval when known
status: completed
complexity: low
methodology: classic
depends_on: []

description: |
  InProcessScheduler.poll() currently polls every suspect lane (degraded/down/
  out_of_credit) on a flat DEFAULT_INTERVAL_MS (5000ms), ignoring the
  reset_at timestamp already captured on the lane's current status. When
  reset_at is known (e.g. a provider's rate-limit or out-of-credit reset
  time), schedule the next refresh() at or shortly after that timestamp
  instead of blindly polling every 5s. When reset_at is null (down for an
  unknown/unstructured reason), keep today's flat-interval behavior — that's
  already the correct fallback.

acceptance_criteria:
  - "Given a suspect lane with a current status reset_at 30 minutes in the future, when poll() schedules its next tick, then the delay is computed from reset_at (clamped to at least DEFAULT_INTERVAL_MS as a floor), not the flat 5s default"
  - "Given a suspect lane with reset_at null, when poll() schedules its next tick, then the delay is the existing flat DEFAULT_INTERVAL_MS (unchanged behavior)"
  - "Given a suspect lane with reset_at in the past (clock skew / stale data), when poll() schedules its next tick, then the delay clamps to DEFAULT_INTERVAL_MS rather than producing a zero/negative/near-zero delay"
  - "Given a lane recovers to a healthy status, when poll() runs, then scheduling reverts to the existing 'no refresh this cycle' healthy-lane behavior (unchanged — this story only changes the suspect-lane delay computation, not the healthy-lane path)"

steps:
  - id: research
    description: Confirm current InProcessScheduler.poll()/scheduleNext() behavior and existing test coverage before changing the delay computation
    agent: researcher
  - id: implement
    description: Add reset_at-aware delay computation to InProcessScheduler; keep the flat-interval fallback for null reset_at
    agent: developer
    depends_on: [research]
  - id: test
    description: Extend in-process-scheduler.test.ts with cases for known reset_at, null reset_at, past reset_at, and the unchanged healthy-lane path
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness and convention compliance (options-object injection pattern, no-box-daemon compliance)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

