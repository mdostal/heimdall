code_examples:
  - title: getLaneStatuses() to extend (src/api/http-server.ts:536-552)
    file: src/api/http-server.ts
    snippet: |
      export function getLaneStatuses(registry: LaneRegistry, store: StateStore): LaneStatusWithOverride[] {
        ...
        return store.getAllCurrentStatuses().map((status) => {
          const declared = registry.get(status.lane_id);
          return {
            ...status,
            manual_override: store.getManualOverride(status.lane_id),
            ...
            manual_cost_tier: store.getManualCostTier(status.lane_id),
          };
        });
      }
  - title: LaneAgentResolver's unmapped-lane behavior — already verified safe
    file: src/core/actuation/lane-agent-resolver.ts
    snippet: |
      resolve(laneId: string): string[] {
        return this.mappings.get(laneId) ?? [];
      }

design_decisions:
  - decision: multica_agent_ids is always present as an array (never
      omitted for an unmapped lane).
    rationale: Matches this codebase's existing convention on every other
      optional-per-lane field in getLaneStatuses() (manual_override etc.
      are always present, null/false when unset) — a consumer should never
      have to special-case `undefined` vs. an empty value.

metric:
  applies: false
  justification: Additive read-only API field with no standalone success
    metric of its own; its value is realized by Pantheon's future
    consumption, which is out of this epic's scope to measure.
