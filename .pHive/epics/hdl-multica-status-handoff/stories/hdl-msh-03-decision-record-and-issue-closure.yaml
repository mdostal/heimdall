    description: Write the decision record; fix the two stale header
      comments; clean .env.example; rewrite the vision.md backlog item.
    agent: developer
  - id: review
    description: Confirm the decision record states constraints as verified
      fact (with real file/line citations) rather than restating opinion,
      and stays neutral on Pantheon's own future architecture choice.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/hdl-multica-status-handoff;
      after this epic's PR merges to dev, comment on and close heimdall#83
      referencing the decision record and the merge commit.
    agent: developer
    depends_on: [review]

