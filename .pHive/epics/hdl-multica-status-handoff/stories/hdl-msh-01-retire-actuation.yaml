design_decisions:
  - decision: Delete the actuation stack outright rather than gate it behind
      a feature flag defaulting off.
    rationale: A flag implies the code might be re-enabled later, which is
      false — Multica's own API constraints (verified live) mean this
      specific lever can never work correctly no matter how it's
      configured. Keeping dead, permanently-broken code around is worse
      than deleting it; the operator's own instruction was "turn off,"
      confirmed to mean retire, not toggle.

risks:
  - severity: medium
    description: A currently-configured deployment (the operator's own
      dostal@hive .env) has MULTICA_BASE_URL/WORKSPACE_ID/PAT_TOKEN set and
      may appear to lose functionality.
    mitigation: It wasn't real working functionality — every disable attempt
      has 400'd since hda-03 shipped (heimdall#83 is the proof). Nothing
      observable regresses; the decision record (hdl-msh-03) states this
      plainly.
  - severity: low
    description: circuit-breaker.ts turns out to have a consumer the
      repo-wide grep missed (e.g. a script outside src/).
    mitigation: npm run build && npm test is the real gate, not the grep —
      run it and fix forward if it surfaces anything.

