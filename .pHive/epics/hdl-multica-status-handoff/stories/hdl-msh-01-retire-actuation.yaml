description: >
  heimdall#83: MulticaControlAdapter.disableAgent() calls
  updateAgent(id, { max_concurrent_tasks: 0 }), and Multica's real API
  rejects 0 unconditionally (confirmed live against dostal@hive — 400,
  "max_concurrent_tasks must be between 1 and 50", server/internal/
  agentconfig/concurrency.go). Verified further that Multica's real
  ClaimTask gate (server/internal/service/task.go) treats concurrency as a
  throttle, not a switch, at any value >= 1, and the only real stop
  (ArchiveAgent) unconditionally cancels every in-flight task. There is no
  fix to the number that makes this lever work correctly.

  Per operator direction, this story does not patch the lever — it retires
  Heimdall's direct Multica actuation entirely, permanently, not behind a
  flag. The actuation stack (multica-rest-client.ts, multica-control-
  adapter.ts, circuit-breaker.ts) is confirmed fully isolated (used only by
  each other and by their construction in main.ts) — delete it outright.
  main.ts's per-lane control-adapter selection already has a fully-proven
  "no real actuation" path (any deployment missing MULTICA_BASE_URL/
  WORKSPACE_ID/PAT already falls back to StubControlAdapter today) — this
  story makes that the only path, unconditionally, rather than inventing a
  new off state.

  Do not touch MulticaAutopilotScheduler or MULTICA_AUTOPILOT_AGENT —
  confirmed via source read to be a separate feature (registers autopilot
  cron triggers via the `multica` CLI) sharing no code with the actuation
  stack. Do not touch ControlAdapter, StubControlAdapter, ActuationStub, or
  the statusWatcher interval in main.ts — they already correctly model "no
  real action taken" and the epic's own adversarial review confirmed
  ActuationStub's "would disable/re-enable" phrasing is already accurate
  for a world where nothing acts on it (see grill-record.md Notes).

acceptance_criteria:
  - "Given any combination of MULTICA_BASE_URL/MULTICA_WORKSPACE_ID/MULTICA_PAT_TOKEN set or unset in env, when composeService() runs, then every lane's entry in controlAdapters is a StubControlAdapter instance."
  - "Given the deletion above, when npm run build && npm test runs, then it passes with zero references to MulticaRestClient/MulticaControlAdapter/the actuation CircuitBreaker remaining anywhere in src/."
  - "Given a lane with a HEIMDALL_LANE_<N>_MULTICA_AGENT_IDS mapping configured, when a status transition occurs, then ActuationStub still records/logs the intended action exactly as before (unchanged behavior for this component)."

