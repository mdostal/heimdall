    change: Add test cases per acceptance criteria above.

code_examples:
  - title: Existing router style — the new GET / branch should match this exactly
    file: src/api/http-server.ts
    snippet: |
      if (req.method === "GET" && req.url === "/healthz") {
        res.writeHead(200, { "content-type": "application/json" });
        res.end(JSON.stringify({ status: "ok" }));
        return;
      }

      if (req.method === "GET" && req.url === "/lanes") {
        res.writeHead(200, { "content-type": "application/json" });
        res.end(JSON.stringify(getLaneStatuses(registry, store)));
        return;
      }

  - title: The data shape the dashboard renders (LaneStatus) — already correct end-to-end
    file: src/core/status-model.ts
    snippet: |
      export interface LaneStatus {
        lane_id: string;
        provider: string;
        status: LaneStatusValue;
        reset_at: string | null;
        reason: string | null;
        last_updated: string;
        signal_source: SignalSource;
      }

design_decisions:
  - decision: Keep the HTML/CSS/JS in a separate module (src/api/ui/dashboard.ts) rather than a large inline string literal inside http-server.ts.
    rationale: Keeps the router file scannable; matches this repo's existing one-concern-per-file layout (route-selector.ts, status-model.ts are each single-purpose files).
  - decision: No build step, no framework, no new npm dependency — a plain string-templated HTML page with inline <style>/<script>.
    rationale: "Matches package.json's existing zero-UI-dependency footprint and north_star.audience (\"internal/operator-facing... not a polished public product\"); a build step or framework would be disproportionate to a single-operator read-only status page."

cross_cutting:
  - concern: documentation
    action: "Update README.md's architecture diagram/Query-surfaces section to mention the new GET / dashboard alongside HTTP·CLI·MCP."

risks:
  - severity: low
    description: A malformed/missing reset_at could render as 'Invalid Date' if formatted naively.
    mitigation: Explicit acceptance criterion above (blank when null) — test must cover this case directly.

