id: hdl-ui-01-readonly-status-view
epic: hdl-lane-status-ui
title: GET / serves a read-only live lane-status dashboard
status: completed
complexity: low
methodology: classic
depends_on: []

description: |
  Add GET / to the existing node:http router in src/api/http-server.ts,
  returning a single self-contained HTML page (inline <style>/<script>, no
  build step, no new npm dependency) that polls the existing GET /lanes
  endpoint and renders one row per lane: lane_id, provider, a color-coded
  status badge, reason, a human-formatted reset_at (blank when null),
  last_updated, and signal_source. This is the first vertical slice of
  Heimdall's standalone-mode UI requirement (has_ui: true) — read-only
  visibility only; manual disable/enable, add-lane, and MCP agent-tooling
  are explicitly deferred to follow-up epics (see design-discussion.md).

acceptance_criteria:
  - "Given the server is running with 0 or more declared lanes, when a browser requests GET /, then it receives a 200 text/html response containing a table (or equivalent) that will render one row per lane returned by GET /lanes"
  - "Given a lane has a non-null reset_at, when the page renders that lane's row, then reset_at is shown in a human-readable form (not a raw ISO string dumped verbatim, though a straightforward Date formatting call is sufficient — no timezone-conversion complexity required)"
  - "Given a lane has reset_at: null (the common case — up, or unconfigured), when the page renders that lane's row, then the reset_at cell is blank, not 'Invalid Date', 'null', or similar"
  - "Given zero lanes are declared, when GET / is requested, then the page still renders 200 with an empty-state message, not an error"
  - "The page's JS only ever calls Heimdall's own GET /lanes endpoint (relative fetch, same-origin) — no external network requests, no CDN script/style tags (matches the zero-external-dependency ethos already established for this repo)"
  - "GET /lanes, GET /healthz, GET /available-route, and POST /lanes/:laneId/refresh all continue to behave exactly as before — this story only adds a new route, it does not modify existing ones"

steps:
  - id: research
    description: Confirm the existing router structure in http-server.ts and the exact LaneStatus shape returned by GET /lanes before writing the new route
    agent: researcher
  - id: implement
    description: Add src/api/ui/dashboard.ts (HTML/CSS/JS template) and wire GET / into http-server.ts's existing router chain
    agent: developer
    depends_on: [research]
  - id: test
    description: Extend src/api/http-server.test.ts with cases for GET / per the acceptance criteria above
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for correctness, convention compliance (matches existing router style, zero new dependencies), and confirm no existing route's behavior changed
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

