description: >
  Adds Kimi K3 (Moonshot AI) as a fourth supported lane provider, mirroring
  hdl-gemini-signals's shape exactly: active-probe/kimi.ts (OpenAI-compatible
  api.moonshot.ai host, Bearer auth like Codex, typed error.type vocabulary
  distinguishing transient overload/rate-limit from longer-lived quota
  exhaustion) and public-status/kimi.ts (status.moonshot.cn -- a real
  Atlassian-Statuspage feed, the same shape Claude's/Codex's adapters already
  consume, a better fit than Gemini's incidents.json workaround). Real web
  research backing every decision is in research-brief.md/design-discussion.md.

