  matched_tags: [backend, signal-sources, provider-expansion, small-scope]
  roster: [researcher, technical-writer]
  per_tag_reasoning:
    backend: two new adapter files behind the existing ProviderSignalAdapter shape.
    signal-sources: extends REQ-01/02/03's layered signal model to a fourth provider.
    provider-expansion: closes another concrete gap against north_star.expected_scale -- 4 of 6 providers implemented after this epic.
