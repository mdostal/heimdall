design_decisions:
  - decision: "Fragment list [\"API\", \"Model\"], broader than claude.ts's/codex.ts's narrower per-product fragments."
    rationale: "Moonshot's status page has no K3-specific component yet (confirmed in research-brief.md's 2026-08-13 component snapshot) -- a broad match on the current *Model/API component family avoids needing a per-model-version update when that changes."

risks:
  - severity: low
    description: The broad fragment list could match a future unrelated component whose name happens to contain 'Model' or 'API'.
    mitigation: "Same tradeoff class already accepted by claude.ts/codex.ts's own fragment lists; documented in-file for easy tuning."

