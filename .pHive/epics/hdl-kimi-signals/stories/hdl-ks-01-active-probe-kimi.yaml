id: hdl-ks-01-active-probe-kimi
epic: hdl-kimi-signals
title: Kimi K3 active-probe adapter (models list, Bearer auth, typed error.type quota-vs-transient split)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implements src/core/signal-sources/active-probe/kimi.ts. Closest structural
  mirror is active-probe/codex.ts (Bearer-token auth, OpenAI-API-compatible
  host, best-effort JSON error-body parse with a degraded fallback) rather
  than Claude's header-name pattern. GET api.moonshot.ai/v1/models,
  Authorization: Bearer <key>. Moonshot's documented error.type vocabulary
  (research-brief.md) is richer than Codex's own unconfirmed guesswork:
  engine_overloaded/too_many_requests -> degraded (transient);
  billing_quota_exhausted/monthly_quota_exhausted/rolling_quota_exceeded ->
  out_of_credit (longer-lived quota conditions); invalid_api_key/
  invalid_authentication -> down. reset_at reads the retry-after header when
  present and passes it through RAW, mirroring codex.ts's own already-accepted
  simplification for the identical header (no relative-to-absolute
  conversion -- an existing codebase precedent, not a new gap this story
  introduces).

acceptance_criteria:
  - "Given a 2xx response, when probeKimiLane is called, then it returns { status: 'up', reset_at: null, reason: null }"
  - "Given a 401 response with error.type invalid_api_key or invalid_authentication, when probeKimiLane is called, then it returns { status: 'down', reason: <message> }"
  - "Given a 429 or 403 response whose error.type is one of billing_quota_exhausted, monthly_quota_exhausted, rolling_quota_exceeded, when probeKimiLane is called, then it returns { status: 'out_of_credit', reason: <message> }"
  - "Given a 429 response whose error.type is engine_overloaded or too_many_requests, when probeKimiLane is called, then it returns { status: 'degraded', reason: <message> }, and reset_at carries the raw retry-after header value when present, else null"
  - "Given a 429/403 response with an unrecognized or missing error.type, when probeKimiLane is called, then it defaults to 'degraded', never guesses 'out_of_credit'"
  - "Given a 5xx response, when probeKimiLane is called, then it returns { status: 'down', reason: 'server error (<code>)' }"
  - "Given a network-level fetch failure, when probeKimiLane is called, then it never throws -- it returns { status: 'down', reason: 'probe request failed: <message>' }"

