design_decisions:
  - decision: reset_at passes through the raw retry-after header value with no conversion, exactly like codex.ts.
    rationale: "codex.ts already accepts this simplification for the identical header shape (a relative-seconds value, not an ISO timestamp) -- introducing a new conversion here would be inconsistent with the established pattern and out of this story's scope."
  - decision: Unrecognized 429/403 error.type defaults to degraded, never out_of_credit.
    rationale: "Same conservative-default posture as every other adapter in this codebase -- an unrecognized shape should never over-trigger actuation by guessing the more severe verdict."

risks:
  - severity: medium
    description: "The GET /v1/models endpoint's existence at api.moonshot.ai wasn't confirmed via a documented example -- only the general OpenAI-compatible host/auth convention."
    mitigation: "Flagged in-file exactly like codex.ts's own honesty note about its unconfirmed 429 body shape; accepted verification gap, revisit once a live account is tested."
  - severity: low
    description: "error.type vocabulary was documented for the 'Kimi Code' product rather than the raw completions API explicitly."
    mitigation: "Treated as best-available signal per research-brief.md; degraded-default fallback bounds the blast radius of a wrong guess."

