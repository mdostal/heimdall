id: hdl-lm-02-credential-visibility
epic: hdl-lane-management
title: GET /lanes exposes credential_configured, never the raw secret
status: completed
complexity: low
methodology: classic
depends_on: []

description: |
  Expose whether a lane's credential resolved (credential_configured:
  boolean) on GET /lanes, so the UI can show token/config status.
  Preserves the existing invariant that no API response ever serializes
  the actual secret value.

acceptance_criteria:
  - "Given a lane whose credential_ref resolves to a real value, when GET /lanes is called, then that lane's entry includes credential_configured: true"
  - "Given a lane whose credential_ref is missing/empty (REQ-07's down/unconfigured case), when GET /lanes is called, then credential_configured: false"
  - "GET /lanes's response never includes the raw secret value under any field name — grep the response body for the literal token value used in the test's env fixture and assert it's absent"

steps:
  - id: research
    description: Confirm how LaneRegistry/EnvCredentialSource expose credential resolution today (Lane.credential) before wiring it into the API response
    agent: researcher
  - id: implement
    description: Extend getLaneStatuses/LaneStatusWithOverride with credential_configured
    agent: developer
    depends_on: [research]
  - id: test
    description: Extend http-server.test.ts per acceptance criteria above
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review specifically for secret-exposure risk — this is the one story in the epic where a mistake leaks a token
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/heimdall
  tech_stack:
    language: typescript
    runtime: node
    test_runner: "node:test via tsx"
  key_files:
    - path: src/api/http-server.ts
      purpose: "getLaneStatuses / LaneStatusWithOverride (hdl-lo-01) is where credential_configured joins manual_override as an additive field"
    - path: src/core/lane-registry.ts
      purpose: "Lane.credential — already resolved per-lane, already never serialized; this story just exposes its presence as a boolean"

files_to_modify:
  - file: src/api/http-server.ts
    change: "getLaneStatuses maps registry.get(lane_id).credential !== null into credential_configured on each response entry."

design_decisions:
  - decision: Expose only a boolean, never the credential_ref's resolved value or even a partial/masked form of it.
    rationale: The narrowest surface that satisfies "see current environments, tokens etc" as status visibility, without adding any new secret-exposure risk to an already-established no-secrets-over-the-wire invariant.

cross_cutting:
  - concern: documentation
    action: "README's GET /lanes example response gains credential_configured."

risks:
  - severity: high
    description: The most consequential mistake in this whole epic would be accidentally serializing the real secret value instead of a boolean.
    mitigation: Dedicated acceptance criterion asserting the literal token value is absent from the response body; explicit reviewer-lens step 4 dedicated to this risk specifically.

references:
  - path: .pHive/epics/hdl-lane-management/docs/design-discussion.md
    relevant_excerpt: |
      GET /lanes gains credential_configured: boolean per lane ... The
      raw secret is never serialized anywhere — same invariant this
      codebase has held since REQ-07.
