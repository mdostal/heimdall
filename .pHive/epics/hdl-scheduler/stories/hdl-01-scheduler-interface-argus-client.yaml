design_decisions:
  - decision: "Use the standard @opentelemetry/* SDK rather than hand-rolling OTLP protocol handling"
    rationale: "This is the first Node/TS OTEL client in Pantheon — reduces risk to configuration, not protocol-level work."
  - decision: "Fire-and-forget emission, never throws"
    rationale: "Matches the existing codebase's established 'never crash the whole service' philosophy (REQ-07 precedent) — Argus unreachability must not affect Heimdall's core function."

cross_cutting:
  - concern: documentation
    action: "README gains a section on Argus OTEL configuration (endpoint env vars)."
  - concern: argus-otel-emit
    action: "This story IS the argus-otel-emit concern's foundational implementation — emitTick/emitStatusFlip are what every later story calls."

risks:
  - severity: low
    description: "First-of-kind integration risk (no prior Node/TS Argus client to copy)."
    mitigation: "Standard OTEL SDK reduces this to configuration; mockable exporter keeps tests independent of a live Argus connection."

references:
