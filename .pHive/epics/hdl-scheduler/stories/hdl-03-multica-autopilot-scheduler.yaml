design_decisions:
  - decision: "Injectable CommandRunner, never shell out directly in a way that's untestable"
    rationale: "Mirrors the existing fetchImpl injection pattern already established throughout the codebase (passive.ts, active-probe adapters) — consistent testing approach."
  - decision: "Heimdall's repo scope stops at registering the autopilot pointing at a configured agent identifier — does not provision the Multica-side agent itself"
    rationale: "Resolved design discussion open question #1 — agent provisioning is cross-repo, Multica's own concern."

cross_cutting:
  - concern: no-box-daemon
    action: "This IS the sanctioned Multica-autopilot coarse ticker (not a standalone box cron) — implementation checklist requires the cron floor validation as an explicit enforcement point, not just documentation."
  - concern: argus-otel-emit
    action: "Successful autopilot registration emits to Argus."
  - concern: documentation
    action: ".env.example documents the required MULTICA_AUTOPILOT_AGENT variable and cron expression format."

risks:
  - severity: medium
    description: "First real external-CLI shelling-out in this codebase; the research brief's confirmed command shape could still drift from Multica's actual current CLI if Multica itself changes."
    mitigation: "Full command-construction testing without touching a live daemon; the review step explicitly re-checks against the research brief's citations."

