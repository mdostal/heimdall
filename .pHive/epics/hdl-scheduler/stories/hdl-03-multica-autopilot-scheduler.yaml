      Implement CommandRunner interface (injectable, mirrors the existing
      fetchImpl injection pattern used throughout the codebase) and
      MulticaAutopilotScheduler using it to shell out to the real multica
      CLI shape. Validate cron expressions against the 1-minute floor
      before invoking the runner.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Unit tests: correct command construction (mocked CommandRunner,
      asserting exact args), sub-minute cron rejected before shelling out,
      missing MULTICA_AUTOPILOT_AGENT fails clearly, Argus emission on
      successful registration.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review the exact CLI argument shape against the research brief's confirmed real-world usage.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

