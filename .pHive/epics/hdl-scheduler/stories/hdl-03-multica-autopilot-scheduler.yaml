implementation_note: |
  CORRECTED DURING IMPLEMENTATION (2026-07-25) via direct live-CLI inspection
  against the real, running Multica instance (`multica auth status` confirmed
  authenticated; `multica autopilot --help`/`get`/`list --output json`):
  registering a schedule is a TWO-STEP model, not the one-shot `trigger-add`
  this story's original description assumed. `trigger-add <autopilot-id>`
  requires a real server-assigned autopilot ID (a UUID) — it does not create
  an autopilot, only adds a trigger to one that must already exist via
  `multica autopilot create --title --mode --agent --description`. The
  implementation checks for an existing autopilot by title (Multica's CLI has
  no upsert-by-title verb itself) and an existing schedule trigger via `get`
  before calling create/trigger-add, making start() idempotent across restarts.
  Also added a `description` field to MulticaAutopilotSchedulerOptions —
  supplied by the wiring layer (hdl-05), which knows the real refresh-trigger
  command the dispatched agent should run.

description: |
  Implement the default, coarse scheduling backend: on start(), registers
  (or confirms, since Multica's own reconciler upserts by title) a
  cron-driven autopilot via the real `multica autopilot trigger-add
  <autopilot-id> --kind schedule --cron "<cron>" --output json` CLI verb,
  pointing at a configured agent (env var MULTICA_AUTOPILOT_AGENT — the
  actual Multica-side agent that gets dispatched is provisioned separately,
  cross-repo, out of scope here). Cron floor is exactly 1 minute — this
  story must validate/reject cron expressions that violate it before
  shelling out. Command execution goes through an injectable CommandRunner
  so tests never touch a real multica daemon.

acceptance_criteria:
  - "Given a lane and a valid ≥1-minute cron expression, when start() is
     called, then it invokes `multica autopilot trigger-add <autopilot-id>
     --kind schedule --cron \"<cron>\" --output json` via the injected
     CommandRunner with the correct arguments."
  - "Given a cron expression that violates the 1-minute floor (e.g. contains
     a seconds field or sub-minute interval), when start() is called, then
     it rejects with a clear error BEFORE invoking the CommandRunner — never
     silently shells out an invalid cron."
  - "Given MULTICA_AUTOPILOT_AGENT is not configured, when start() is
     called, then it fails clearly (not a silent no-op, not a crash of the
     whole service) — REQ-07's 'never crash the whole service, but never
     silently succeed either' pattern."
  - "Given start() succeeds, when it completes, then it emits to Argus via
     argus-client.ts's emitTick (registration itself counts as a scheduling
     event worth recording)."

steps:
