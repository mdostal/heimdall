design_decisions:
  - decision: Override lives on the `lanes` table (per-lane current state), not lane_status_history (append-only historical log) — a setting, not an observation.
    rationale: lane_status_history's shape (one row per sensed status observation) doesn't fit a persistent operator setting; upsertLane's existing ON CONFLICT pattern already handles per-lane current-state columns correctly.
  - decision: Override takes effect on the next tick (≤5s), not immediately via a forced reconcile call from the HTTP handler.
    rationale: Keeps the HTTP handler's diff minimal and avoids threading the adapter map into the HTTP layer's closure; 5s latency matches the existing suspect-lane InProcessScheduler cadence and is not a meaningfully worse UX for a manual operator action.

