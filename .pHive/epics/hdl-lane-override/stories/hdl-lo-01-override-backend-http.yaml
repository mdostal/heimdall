risks:
  - severity: medium
    description: Schema migration on an already-persisted (non-:memory:) DB file predating this column could error if not handled defensively.
    mitigation: Explicit acceptance criterion above (try/caught ALTER TABLE) — test must cover opening a pre-existing DB file without the column.
  - severity: low
    description: A stuck override (operator forgets it's set) silently changes routing behavior forever.
    mitigation: Deferred to slice 2 (hdl-lo-02) for UI visibility — this story's job is correctness and API surface, not the visibility UX.

