id: hdl-lo-01-override-backend-http
epic: hdl-lane-override
title: Manual lane override — durable state, ControlAdapter-aware, HTTP surface
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  Add a durable per-lane manual override ("enabled" | "disabled" | null)
  that participates in MulticaControlAdapter's existing desiredEnabled
  decision — not a separate/parallel disable mechanism. When set, the
  override wins outright over the sensed status until cleared back to
  "auto" (null). Exposed via POST /lanes/:laneId/override and surfaced on
  GET /lanes so slice 2 (dashboard UI) can render it.

acceptance_criteria:
  - "Given a lane with no override set (the default), when reconcile() runs, then desiredEnabled is computed exactly as before this story — purely from status (byte-identical behavior for the unset case)"
  - "Given an operator sets a lane's override to 'disabled' while the lane's sensed status is 'up', when the next automatic reconcile tick runs, then the lane is blocked (max_concurrent_tasks: 0) despite the healthy status — the override wins"
  - "Given an override is set to 'enabled' while the lane's sensed status is 'down', when reconcile() runs, then the lane is allowed through despite the down status — the override wins"
  - "Given an override was set, when the operator sets it to 'auto' (POST .../override with state: auto), then subsequent reconcile ticks return to status-derived behavior (override cleared, not just set to a third value that happens to match automatic logic)"
  - "POST /lanes/:laneId/override with an unknown lane_id returns 404 with an { error: 'unknown_lane', lane_id } body, matching the existing POST /lanes/:laneId/refresh route's error shape"
  - "POST /lanes/:laneId/override with a body.state outside {enabled, disabled, auto} returns 400 with a structured error, not a silent no-op or a crash"
  - "GET /lanes includes each lane's current override state (null when unset) so a UI consumer can render it without a second request"
  - "MulticaControlAdapter's Argus emission (emitActuationResult) includes an overrideActive: true field when the block/allow decision for that tick was override-driven, and is absent/false when status-driven — distinguishable in telemetry"
  - "A fresh (:memory: or newly-created file) StateStore has the manual_override column from CREATE TABLE; an already-existing persisted DB file (pre-dating this story) does not crash on open — the defensive ALTER TABLE path is exercised without error"
  - "All previously-shipped routes and reconcile() behavior for the non-override case are unchanged — npm test passes with zero regressions in existing test files"

