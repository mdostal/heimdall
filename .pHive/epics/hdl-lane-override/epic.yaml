description: >
  Manual lane disable/enable, routed through the existing ControlAdapter
  path per explicit operator direction (not a separate/parallel disable
  mechanism). A per-lane override ('enabled' | 'disabled' | null) wins
  outright over the sensed status in MulticaControlAdapter's desiredEnabled
  computation when set; behavior is byte-identical to today when unset.
  Slice 1: durable state + HTTP surface. Slice 2: dashboard controls +
  visibility indicator. See docs/decisions/DEC-hdl-reason-aware-recovery.md
  item 3 and this epic's design-discussion.md.

