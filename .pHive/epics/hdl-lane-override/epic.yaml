planning_team:
  matched_tags: [backend, actuation, ui, small-scope]
  roster: [researcher, technical-writer]
  per_tag_reasoning:
    backend: StateStore + ControlAdapter changes are the correctness core.
    actuation: Override participates in the existing reconcile()/desiredEnabled decision.
    ui: Slice 2 surfaces the control + indicator on the dashboard.
    small-scope: Well-isolated diffs across files already touched by the two prior epics — design discussion alone is sufficient per the plan skill's Small-scope routing rule.
