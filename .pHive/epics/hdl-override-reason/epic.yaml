name: hdl-override-reason
title: Optional free-text reason alongside manual lane override
target_codebase: /Users/mdostal/Documents/work/pantheon/heimdall
methodology: classic
version_bump: minor
sidecar_retention: transient

git_flow:
  base_branch: dev
  branch_strategy: per-epic

planning_team:
  matched_tags: [small-scope, data-model, ui]
  roster: []
  per_tag_reasoning:
    small-scope: one new nullable column, one new function param, thin surface changes across HTTP/MCP/dashboard.
    data-model: mirrors the exact established getX/setX-per-field pattern (manual_override, manual_reset_at) already used twice in state-store.ts.
