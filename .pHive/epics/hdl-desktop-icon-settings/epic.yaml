name: hdl-desktop-icon-settings
title: Rust-side tray icon consumption of the operator's icon preference
target_codebase: /Users/mdostal/Documents/work/pantheon/heimdall
methodology: classic
version_bump: minor
sidecar_retention: transient

git_flow:
  base_branch: dev
  branch_strategy: per-epic

planning_team:
  matched_tags: [cross-language, real-platform-constraint, follow-up]
  roster: []
  per_tag_reasoning:
    cross-language: Rust shell consuming a Node-persisted preference over HTTP, plus real macOS/Tauri icon-loading API research.
    real-platform-constraint: Tauri v2 on macOS genuinely cannot swap the Dock icon at runtime -- confirmed via research before implementation, not discovered as a surprise mid-build.
