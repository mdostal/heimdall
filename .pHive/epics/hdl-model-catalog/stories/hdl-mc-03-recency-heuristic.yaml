id: hdl-mc-03-recency-heuristic
epic: hdl-model-catalog
title: Per-provider "newest models" default-enable heuristic
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  New src/core/model-recency.ts. Exports
  defaultEnabledModelIds(provider, entries: RawModelEntry[]): Set<string>
  -- pure function, no I/O, easily unit-testable in isolation from the
  fetch layer (hdl-mc-02) and the storage layer (hdl-mc-01). Per
  research-brief.md's table:
  - claude/codex: sort by createdAt descending (nulls last), take a
    top-N window (N small enough to be "newest", large enough that an
    operator's own explicitly-declared model is very likely included --
    not just the single latest).
  - kimi: same as claude/codex when createdAt is present on enough
    entries to be meaningful; if createdAt is absent/null across the
    board, fall back to enabling ALL entries (never guess a subset when
    there's no real signal to rank by).
  - gemini: extract the leading generation number from id (regex on
    patterns like "gemini-3", "gemini-2.5"), keep entries matching the
    HIGHEST generation number found across all entries, with a
    -preview/-latest suffix as a same-generation tiebreak toward
    "include." Unparseable ids default to INCLUDED (safe-open, never
    silently hidden), logged as unrecognized.

acceptance_criteria:
  - "Given a list of Claude/Codex entries with distinct createdAt values, when defaultEnabledModelIds is called, then the returned set contains the top-N most recently created entries by createdAt, not an arbitrary subset"
  - "Given Kimi entries where every createdAt is null, when defaultEnabledModelIds is called, then the returned set contains ALL entries (no real signal to rank by -- enable everything rather than guess)"
  - "Given Kimi entries where createdAt IS present, when defaultEnabledModelIds is called, then it behaves like the Claude/Codex case (sort + top-N)"
  - "Given Gemini entries mixing generation numbers (e.g. some ids matching gemini-2.5-*, others gemini-3-*), when defaultEnabledModelIds is called, then only the highest-generation entries are included, never the older generation"
  - "Given a Gemini entry whose id doesn't match the expected generation-number pattern at all, when defaultEnabledModelIds is called, then it defaults to INCLUDED, not silently excluded"
  - "Given an empty entries array for any provider, when defaultEnabledModelIds is called, then it returns an empty set without throwing"

steps:
  - id: implement
    description: Implement defaultEnabledModelIds with the per-provider branches described above
    agent: developer
  - id: test
    description: Unit tests covering every acceptance criterion with realistic fixture data per provider
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review that every "no clear signal" case defaults to the SAFE-OPEN choice (include), never silently excludes a model the operator might need
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

