design_decisions:
  - decision: Every ambiguous/no-signal case defaults to INCLUDED (safe-open), never excluded.
    rationale: "The failure mode of over-including a slightly-older model (operator sees one extra option, can disable it) is far less harmful than under-including and silently hiding a model the operator's own lane already declares -- matches this codebase's consistent 'never silently hide/deny on ambiguity' posture (e.g. public-status adapters defaulting to degraded, never up, on unrecognized input -- same principle, opposite direction, because the harm direction is reversed here)."
  - decision: Top-N (not top-1) for the createdAt-sortable providers.
    rationale: "design-discussion.md's resolved question 2 -- an operator's own explicitly-declared HEIMDALL_LANE_N_MODEL should very likely land inside the default-enabled set on first boot, not just Anthropic's/OpenAI's single newest release."

risks:
  - severity: low
    description: The Gemini generation-number regex could misparse a genuinely novel future naming convention.
    mitigation: "Unparseable ids default to included, not excluded -- worst case is a slightly noisier default set, never a silently missing model."

