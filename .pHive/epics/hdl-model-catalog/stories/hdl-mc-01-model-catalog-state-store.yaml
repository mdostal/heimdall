design_decisions:
  - decision: upsertModelSeen only sets `enabled` on first sight; never overwrites it on subsequent refreshes.
    rationale: "This is the single most important correctness property of the whole epic -- research-brief.md's design explicitly requires an operator's deliberate toggle to survive future catalog refreshes. Getting this backwards would silently undo operator choices on every refresh."

risks:
