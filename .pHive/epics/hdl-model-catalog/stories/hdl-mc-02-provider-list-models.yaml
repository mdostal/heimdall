design_decisions:
  - decision: A separate function per provider rather than reusing the active-probe function's response.
    rationale: "Probe calls run on a health-polling cadence; catalog refresh is a coarser, separate cadence (design-discussion.md). Coupling them would mean every health poll also does catalog-diff work, or every catalog refresh piggybacks on health polling's timing -- neither is right. Small, acceptable duplication of the HTTP call itself, not of any logic."
  - decision: These functions never throw, returning [] on any failure.
    rationale: "Matches the never-throws contract every signal-source function in this codebase already follows; the orchestration layer (hdl-mc-04) decides what an empty result means for that provider's catalog state, not this layer."

risks:
  - severity: low
    description: Kimi's created-field presence is unconfirmed against a live response.
    mitigation: "Defensive optional-field read -- null when absent, never a crash. Same accepted-gap posture as every other unconfirmed field in this codebase's provider adapters."

