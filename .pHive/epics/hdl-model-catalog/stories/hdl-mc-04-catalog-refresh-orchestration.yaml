design_decisions:
  - decision: Dedup fetches by (provider, credential_ref), not by lane.
    rationale: "Mirrors hdl-openrouter-signals's nested-gateway precedent -- multiple lanes can legitimately share one credential; refetching the same provider's list once per lane would be wasteful and, for rate-limited providers, needlessly risky."
  - decision: One provider's fetch failure never aborts the whole refresh.
    rationale: "Per-lane/per-provider failure isolation is an established, repeated pattern in this codebase (MulticaAutopilotScheduler's per-lane try/catch, LanePipeline's per-lane resolution) -- a model catalog refresh across multiple providers should have the same isolation."

risks:
  - severity: low
    description: None beyond the standard orchestration-layer risk class already covered by LanePipeline's own precedent for per-lane isolation.
    mitigation: "Direct test coverage for the failure-isolation and dedup properties specifically."

