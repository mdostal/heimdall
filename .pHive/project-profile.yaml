north_star:
  goal: >
    Be the Pantheon's health-aware LLM/lane router: automate spreading agent
    work across providers and accounts by available headroom, replacing
    Mathew's manual account/runtime juggling. Router interface consumed by
    the Auriga orchestrator per-dispatch; ships as both a standalone service
    (any multi-agent-capable harness) and a Pantheon plugin.
  audience: >
    Internal/operator-facing: Mathew today, generalizing to any operator
    running a multi-agent fleet across multiple provider accounts (Claude,
    Codex, Gemini, OpenRouter, Kimi, Ollama, etc.), whether standalone or via
    the Pantheon (Auriga orchestrator).
  expected_scale: >
    Bursty, scales with attached compute/workstations. v1 target: consistent
    30+ concurrent agents, designed to grow toward ~300 as hardware/instances
    are added. Multiple accounts per provider (e.g. 2-5 Claude Code
    subscriptions, or per-workstation configs) across Claude, Codex, Gemini,
    OpenRouter, Kimi K3, and others. Heimdall is the gating layer
    distinguishing active / out-of-credit-will-reactivate / provider-down /
    overloaded lane states.
  pain_points: >
    Manual long-lived runtime/token juggling across accounts and workstations
    today (stopgap: local .env/vault per workstation before Portunus
    integration); OAuth and other silent runtime hangs that produce false
    failures, corrupt metrics, drop work, and halt operations.
  success: >
    No manual routing required; full visibility into spreading with
    OTel-style metrics reported out (Heimdall reports the data, doesn't have
    to own the metrics stack) — realistic downtime/health-check visibility;
    ability to toggle routes on/off for A/B testing of routing heuristics.
  avoid: >
    Don't rebuild a full gateway/full stack from scratch — research and
    leverage what exists (Vercel AI Gateway/AI SDK, OpenRouter, etc.) and
    link them up where subscriptions allow; local health-checked routing is
    still needed since subscriptions often don't federate through those
    gateways. Don't hard-code cheap-tier avoidance as an absolute rule —
    routing heuristics (including whether cheap tiers are acceptable) must
    be easily A/B-testable/reconfigurable, potentially driven by the request
    itself; PoC this.
