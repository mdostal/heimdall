existing_knowledge:
  mcp_servers: []
  existing_skills: []
  existing_hooks: []
  # No .claude/ directory present at re-kickoff (2026-08-12) — no project-local settings/skills/hooks to inventory.

code_quality:
  linters: []
  formatters: []
  pre_commit:
    framework: null
    hooks: []
  code_snippets:
    - path: src/main.ts
      pattern: composition-root
      annotation: >
        composeService() wires registry, state store, telemetry, schedulers,
        and control-adapter reconcile loop into one running service; kept
        separate from the entrypoint so tests can inject a mock
        CommandRunner/fetchImpl and inspect every piece without touching a
        real Multica daemon, Argus connection, or bound port.
      lines: "1-40"
    - path: src/core/lane-registry.ts
      pattern: env-driven-declarative-config
      annotation: >
        Lanes declared via HEIMDALL_LANE_<N>_{ID,PROVIDER,CREDENTIAL_REF}
        env-var triples (contiguous numbering, stops at first gap);
        credential resolution failure is reported as down/unconfigured
        rather than crashing or silently dropping the lane (REQ-07).
      lines: "1-25"
  test_first_signals:
    co_located_tests: true
    test_before_source: inconclusive
    test_runner_in_precommit: false
    bdd_keywords: false
    test_absence: false
project_maturity: active_development

