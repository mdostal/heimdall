remote_theme: just-the-docs/just-the-docs

title: Heimdall
description: The health-aware lane gateway and router for Pantheon.

url: "https://mdostal.github.io"
baseurl: "/heimdall"

# just-the-docs settings
color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Aux nav (top right)
aux_links:
  "GitHub":
    - "https://github.com/mdostal/heimdall"

aux_links_new_tab: true

# Footer
footer_content: "MIT License &mdash; <a href=\"https://github.com/mdostal/heimdall\">mdostal/heimdall</a>"

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchors
heading_anchors: true

# Collections for nav ordering
nav_sort: case_insensitive

# Exclude source files from build
exclude:
  - "*.gemspec"
  - node_modules/
  - vendor/
